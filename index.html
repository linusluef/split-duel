<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Split Duel">
<meta name="theme-color" content="#0b0c18">
<meta name="description" content="Five-game party duel for one screen: Pong, Tanks, Sumo Ring, Rooftop Run and Quick Draw. Play a friend, the bot, or online.">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Split Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: one full-bleed canvas, split across its long axis; each half faces its own player */
:root{
  --bg:#0b0c18;      /* arena ink, faint blue bias */
  --ink:#eef0ff;     /* primary text */
  --dim:#7c82ab;     /* secondary text */
  --line:#262a4d;    /* grid + midline */
  --block:#171a33;   /* tank obstacles */
  --edge:#3d4377;    /* obstacle edges */
  --p1:#ff7a3d;      /* ORANGE player */
  --p2:#2fd0ff;      /* CYAN player */
  --pow:#ffe14d;     /* power-up orbs */
  --storm:#e8336b;   /* closing storm in tank duel */
  --common:#7ddc8f;  /* common skins */
  --rare:#c08cff;    /* rare skins */
  --leather:#c4864f; /* cowboy hat */
  --pad1:#ff5a6e; --pad2:#ffd24a; --pad3:#5ee07a; --pad4:#4aa8ff; /* Echo pads, Beat lanes */
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);background:var(--bg)}
canvas{display:block;width:100%;height:100%;touch-action:none}

#inst,#net{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(5,6,14,.82);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  font-family:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;color:var(--ink);-webkit-user-select:text;user-select:text;touch-action:auto}
#inst[hidden],#net[hidden]{display:none!important}
.inst-card{position:relative;width:min(680px,100%);max-height:100%;overflow:auto;background:var(--bg);border:2px solid var(--edge);border-radius:18px;padding:28px 28px 24px;box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.6)}
.inst-eyebrow{margin:0 0 6px;font-size:12px;letter-spacing:.14em;color:var(--dim)}
#inst h2,#net h2{margin:0 0 18px;font:400 clamp(24px,5vw,34px)/1.1 "Bungee","Arial Black",Impact,sans-serif;color:var(--ink);text-wrap:balance}
.inst-cols{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:start}
@media (max-width:560px){.inst-cols{grid-template-columns:1fr}.inst-qr{justify-self:center}}
.inst-steps{min-width:0;font-size:17px;line-height:1.45}
.inst-steps ol{margin:0;padding:0;list-style:none;display:grid;gap:14px;counter-reset:s}
.inst-steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;counter-increment:s}
.inst-steps li::before{content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--p1);color:var(--bg);font:400 16px "Bungee","Arial Black",sans-serif}
.inst-steps p{margin:0}
.inst-steps .note{margin-top:14px;font-size:14px;color:var(--dim)}
.inst-steps b{color:var(--ink)}
.inst-ico{display:inline-block;width:22px;height:22px;vertical-align:-5px;margin:0 2px;color:var(--p2)}
.inst-primary{display:inline-flex;align-items:center;gap:10px;margin:4px 0 10px;padding:14px 22px;border:0;border-radius:12px;background:var(--p1);color:var(--bg);font:400 18px "Bungee","Arial Black",sans-serif;cursor:pointer;box-shadow:0 0 24px rgba(255,122,61,.45)}
.inst-primary:focus-visible,.inst-x:focus-visible{outline:3px solid var(--pow);outline-offset:3px}
.inst-x{position:absolute;top:10px;right:12px;width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:var(--dim);font-size:30px;line-height:1;cursor:pointer}
.inst-qr{margin:0;display:grid;gap:10px;justify-items:center;width:220px;max-width:100%}
.inst-qr canvas{width:220px;max-width:100%;height:auto;aspect-ratio:1;border-radius:12px;background:#fff}
.inst-qr figcaption{font-size:13px;line-height:1.35;color:var(--dim);text-align:center}
.inst-arrow{position:fixed;width:54px;height:54px;color:var(--pow);filter:drop-shadow(0 0 10px rgba(255,225,77,.6));pointer-events:none}
.inst-arrow svg{width:100%;height:100%}
.inst-arrow.up{top:calc(env(safe-area-inset-top,0px) + 6px);right:calc(env(safe-area-inset-right,0px) + 92px);animation:instUp 1s ease-in-out infinite}
.inst-arrow.down{bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:50%;margin-left:-27px;animation:instDown 1s ease-in-out infinite}
  .inst-arrow.down svg{transform:rotate(180deg)}
.net-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:560px){.net-grid{grid-template-columns:1fr}}
.net-grid section{min-width:0;display:grid;gap:12px;align-content:start;padding:18px;border:1.5px solid var(--line);border-radius:14px}
.net-grid h3{margin:0;font:400 18px "Bungee","Arial Black",sans-serif;color:var(--ink)}
.net-grid p{margin:0;color:var(--dim);font-size:15px;line-height:1.4}
#net-join{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#net-join .inst-primary{margin:0}
#net-code{flex:1 1 120px;min-width:0;padding:11px 14px;border-radius:12px;border:2px solid var(--edge);background:var(--block);color:var(--ink);font:400 24px "Bungee","Arial Black",sans-serif;letter-spacing:.25em;text-transform:uppercase}
#net-code:focus-visible{outline:3px solid var(--pow);outline-offset:2px}
.net-label{margin:0;font-size:12px;letter-spacing:.14em;color:var(--dim)}
.net-code{margin:0 0 6px;font:400 clamp(44px,12vw,64px)/1 "Bungee","Arial Black",sans-serif;letter-spacing:.12em;color:var(--pow)}
.net-link{margin:6px 0 0;font-size:13px;color:var(--dim);word-break:break-all;-webkit-user-select:all;user-select:all}
.net-status{margin:16px 0 0;font-size:15px;line-height:1.4;color:var(--dim);min-height:1.4em}
.net-status.err{color:var(--storm)}
.net-status.wait::after{content:"";display:inline-block;width:8px;height:8px;margin-left:10px;border-radius:50%;background:var(--pow);vertical-align:1px;animation:netPulse 1s ease-in-out infinite}
@keyframes netPulse{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.net-status.wait::after{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);z-index:30;width:max-content;max-width:calc(100% - 32px);padding:12px 18px;background:var(--bg);color:var(--ink);border:2px solid var(--edge);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);font:500 16px/1.35 "Chakra Petch","Trebuchet MS",sans-serif;text-align:center}
.toast[hidden]{display:none!important}
.dlg{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(5,6,14,.82);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  font-family:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;color:var(--ink);-webkit-user-select:text;user-select:text;touch-action:auto}
.dlg[hidden],.home[hidden]{display:none!important}
.dlg.top{z-index:26}
.dlg h2{margin:0 0 18px;font:400 clamp(24px,5vw,34px)/1.1 "Bungee","Arial Black",Impact,sans-serif;color:var(--ink);text-wrap:balance}
.inst-card.wide{width:min(760px,100%)} .inst-card.narrow{width:min(480px,100%)}
#pedit-card.flip{transform:rotate(180deg)}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border:2px solid var(--edge);border-radius:12px;background:transparent;color:var(--ink);font:400 15px "Bungee","Arial Black",sans-serif;cursor:pointer}
.btn-ghost.warn{border-color:var(--storm);color:var(--storm)}
.inst-primary:disabled,.btn-ghost:disabled,.ib:disabled,.chip:disabled{opacity:.4;cursor:default;box-shadow:none}
.btn-ghost:focus-visible,.segb:focus-visible,.ib:focus-visible,.chip:focus-visible,.pp:focus-visible,.pc:focus-visible,.sk:focus-visible,.avb:focus-visible,.tool:focus-visible,.mode:focus-visible,.resume:focus-visible,.back:focus-visible{outline:3px solid var(--pow);outline-offset:2px}
/* home */
.home{position:fixed;inset:0;z-index:15;display:grid;grid-template-rows:auto 1fr;background:linear-gradient(180deg,rgba(11,12,24,.55),rgba(11,12,24,.78));overflow:auto;
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  font-family:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;color:var(--ink);touch-action:auto}
.home-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;max-width:980px;width:100%;margin:0 auto}
.home-tools{display:flex;gap:8px;margin-left:auto}
.tool{display:grid;justify-items:center;gap:4px;min-width:66px;padding:9px 10px 7px;border:1.5px solid var(--line);border-radius:12px;background:rgba(11,12,24,.75);color:var(--ink);font:700 11px "Chakra Petch",sans-serif;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
.tool[hidden]{display:none}
.tool svg{width:24px;height:24px;color:var(--pow)}
.home-champ{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--ink)} .home-champ img,.champ img{width:46px;height:46px}
.home-champ small,.champ small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--pow)}
.home-main{display:grid;align-content:center;justify-items:center;gap:22px;padding-block:16px}
.logo{margin:0;display:grid;justify-items:center;font:400 clamp(58px,15vw,128px)/.9 "Bungee","Arial Black",Impact,sans-serif;letter-spacing:.02em}
.logo .l1{color:var(--p1);text-shadow:0 0 34px rgba(255,122,61,.45);transform:translateX(-.28em)} .logo .l2{color:var(--p2);text-shadow:0 0 34px rgba(47,208,255,.4);transform:translateX(.28em)}
.logo .cut{display:block;width:min(100%,5.2em);height:8px;margin:.1em 0;background:repeating-linear-gradient(90deg,var(--p1) 0 14px,transparent 14px 24px) top/100% 3px no-repeat,repeating-linear-gradient(90deg,var(--p2) 0 14px,transparent 14px 24px) bottom/100% 3px no-repeat;opacity:.8}
.tag{margin:0;font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim)}
.resume{display:grid;gap:2px;padding:12px 22px;border:2px solid var(--pow);border-radius:14px;background:rgba(11,12,24,.85);color:var(--ink);font:500 14px "Chakra Petch",sans-serif;cursor:pointer;box-shadow:0 0 24px rgba(255,225,77,.2)}
.resume b{font:400 17px "Bungee",sans-serif;color:var(--pow)} .resume[hidden]{display:none}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:min(640px,100%)}
@media (max-width:520px){.modes{grid-template-columns:1fr}}
.mode{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;row-gap:2px;align-items:center;min-width:0;padding:18px;border:2px solid var(--edge);border-radius:16px;background:rgba(23,26,51,.88);color:var(--ink);text-align:left;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s}
.mode:hover{border-color:var(--p1);box-shadow:0 0 0 1px var(--p1),0 0 26px rgba(255,122,61,.28)} .mode:active{transform:scale(.98)}
.mode-ico{grid-row:1/3;width:44px;height:44px} .mode-t{font:400 22px "Bungee","Arial Black",sans-serif} .mode-s{font-size:14px;color:var(--dim)}
.mode[aria-disabled="true"]{opacity:.5}
/* setup */
.su-sec{display:grid;gap:10px;margin:0 0 20px} .su-sec h3,.sk-sec h3,.sub{margin:0;font:400 15px "Bungee",sans-serif;letter-spacing:.04em;color:var(--dim)} .sub{margin:22px 0 10px}
.su-note{margin:0;font-size:14px;line-height:1.45;color:var(--dim)}
.segs{display:flex;flex-wrap:wrap;gap:6px;padding:4px;border:1.5px solid var(--line);border-radius:14px;width:max-content;max-width:100%}
.segb{padding:10px 16px;border:0;border-radius:10px;background:transparent;color:var(--ink);font:400 15px "Bungee",sans-serif;cursor:pointer}
.segb[aria-checked="true"]{background:var(--p1);color:var(--bg)}
.lu-chips{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:8px;counter-reset:lc}
.lu-chips li{counter-increment:lc;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;font:400 13px "Bungee",sans-serif}
.lu-chips li::before{content:counter(lc) "  ";color:var(--dim)}
.lu-list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.lu-list li{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:8px 10px;border:1.5px solid var(--line);border-radius:12px;background:var(--block)}
@media (max-width:520px){.lu-list li{grid-template-columns:auto minmax(0,1fr) auto}.lu-move{grid-column:2/4;justify-self:end}}
.lu-n{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--p1);color:var(--bg);font:400 13px "Bungee",sans-serif}
.lu-name{min-width:0;font:400 15px "Bungee",sans-serif} .lu-name small{display:block;font:500 12px "Chakra Petch",sans-serif;color:var(--dim);letter-spacing:.06em}
.lu-step,.lu-move{display:flex;gap:4px;align-items:center} .lu-step b{min-width:22px;text-align:center;font:400 16px "Bungee",sans-serif;font-variant-numeric:tabular-nums}
.ib{width:38px;height:38px;border:1.5px solid var(--edge);border-radius:10px;background:transparent;color:var(--ink);font:700 18px "Chakra Petch",sans-serif;cursor:pointer}
.ib.del{color:var(--storm)}
.lu-add{display:flex;flex-wrap:wrap;gap:8px;align-items:center} .lu-add>span{font-size:13px;color:var(--dim);margin-right:4px}
.chip{padding:8px 12px;border:1.5px dashed var(--edge);border-radius:999px;background:transparent;color:var(--ink);font:400 13px "Bungee",sans-serif;cursor:pointer}
.su-foot{display:flex;flex-wrap:wrap;gap:12px;justify-content:flex-end;align-items:center;margin-top:8px} .su-foot .inst-primary{margin:0} .su-foot.split{justify-content:space-between;margin-top:22px}
.su-foot.split #t-end{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end}
.su-join{display:flex;gap:8px;flex:1 1 220px;min-width:0}
#su-code{flex:1 1 100px;min-width:0;padding:10px 14px;border-radius:12px;border:2px solid var(--edge);background:var(--block);color:var(--ink);font:400 22px "Bungee",sans-serif;letter-spacing:.25em;text-transform:uppercase}
.pp-grid,.pc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.pp,.pc{display:grid;justify-items:center;gap:4px;min-width:0;padding:10px 6px;border:2px solid var(--line);border-radius:14px;background:var(--block);color:var(--ink);font:400 13px "Bungee",sans-serif;cursor:pointer;text-align:center}
.pp span,.pc b{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp img{width:56px;height:56px} .pc img{width:72px;height:72px} .pc b{font:400 15px "Bungee",sans-serif} .pc span{font:500 12px "Chakra Petch",sans-serif;color:var(--dim)}
.pp[aria-pressed="true"]{border-color:var(--p1);box-shadow:0 0 18px rgba(255,122,61,.3)}
.pp.new,.pc.new{border-style:dashed;align-content:center} .plus{font:400 30px "Bungee",sans-serif;color:var(--pow);line-height:1}
.ck{display:flex;gap:10px;align-items:center;font-size:15px} .ck input{width:22px;height:22px;accent-color:var(--p1)}
/* profile editor */
.fld{display:grid;gap:6px;margin-bottom:14px} .fld span,.avf legend,.rng span{font:400 13px "Bungee",sans-serif;color:var(--dim)}
.fld input{padding:12px 14px;border-radius:12px;border:2px solid var(--edge);background:var(--block);color:var(--ink);font:500 20px "Chakra Petch",sans-serif}
.fld input:focus-visible{outline:3px solid var(--pow);outline-offset:2px}
.avf{margin:0;padding:0;border:0} .avf legend{margin-bottom:8px}
.av-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px}
.avb{padding:4px;border:2px solid transparent;border-radius:14px;background:transparent;cursor:pointer} .avb img{width:100%;height:auto;display:block}
.avb[aria-pressed="true"]{border-color:var(--p1);background:var(--block)}
.err{min-height:1.3em;margin:10px 0 0;color:var(--storm);font-size:14px}
/* profiles */
.back{border:0;background:transparent;color:var(--dim);font:400 14px "Bungee",sans-serif;padding:4px 0;margin-bottom:10px;cursor:pointer}
.ph{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px} .ph img{width:96px;height:96px} .ph-t{flex:1 1 160px;min-width:0} .ph h2{margin:0 0 4px}
.pts{margin:0;color:var(--dim);font-size:15px} .pts b{font:400 22px "Bungee",sans-serif;color:var(--pow);font-variant-numeric:tabular-nums}
.spinrow{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:18px} .spinrow .inst-primary{margin:0}
.sk-sec{display:grid;gap:8px;margin-bottom:16px}
.sk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.sk{display:grid;justify-items:center;gap:2px;min-width:0;padding:8px 6px;border:2px solid var(--line);border-radius:12px;background:var(--block);color:var(--ink);cursor:pointer}
.sk canvas{width:88px;height:56px} .sk b{font:400 12px "Bungee",sans-serif} .sk span{font:500 11px "Chakra Petch",sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.sk.r1 span{color:var(--common)} .sk.r2 span{color:var(--rare)} .sk.r3 span{color:var(--pow)}
.sk.on{border-color:var(--p1);box-shadow:0 0 16px rgba(255,122,61,.3)} .sk.on span{color:var(--p1)}
.sk.locked{opacity:.55} .sk.locked b{color:var(--dim)}
.danger{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px;padding-top:16px;border-top:1.5px solid var(--line)}
/* wheel */
.wheel-wrap{position:relative;width:min(320px,100%);aspect-ratio:1;max-width:100%;margin:0 auto 12px}
.wheel-wrap canvas{width:100%;height:100%;display:block}
.wheel-pin{position:absolute;left:50%;top:-6px;width:0;height:0;margin-left:-14px;border-left:14px solid transparent;border-right:14px solid transparent;border-top:26px solid var(--ink);filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
.center{text-align:center;display:flex;justify-content:center} .pts.center{display:block;margin-bottom:10px}
.wh-res{min-height:90px;margin-top:14px;text-align:center;display:grid;justify-items:center;gap:8px} .wh-res p{margin:0}
.won{font:400 26px "Bungee",sans-serif;color:var(--ink)} .won.r1{color:var(--common)} .won.r2{color:var(--rare)} .won.r3{color:var(--pow);text-shadow:0 0 20px rgba(255,225,77,.5)} .won.dim{color:var(--dim)}
.won-row{display:flex;align-items:center;gap:12px;text-align:left} .won-row canvas{width:88px;height:56px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;margin:12px 0 0;padding:0;list-style:none;font-size:13px;color:var(--dim)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}
/* boards */
.tbl{overflow-x:auto;margin:0 -4px 12px;padding:0 4px}
.board{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:15px;min-width:480px}
.board th{padding:8px 10px;text-align:left;font:400 12px "Bungee",sans-serif;color:var(--dim);border-bottom:1.5px solid var(--line);white-space:nowrap}
.board td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.board tr.lead td{color:var(--pow)} .board tr.lead td:first-child{font-family:"Bungee",sans-serif}
.who{display:inline-flex;align-items:center;gap:10px;font:400 14px "Bungee",sans-serif} .who img{width:34px;height:34px}

<script>
(() => {
const cs = getComputedStyle(document.documentElement);
const tok = n => cs.getPropertyValue(n).trim();
const COL = { bg:tok('--bg'), ink:tok('--ink'), dim:tok('--dim'), line:tok('--line'), block:tok('--block'), edge:tok('--edge'), pow:tok('--pow'), common:tok('--common'), rare:tok('--rare'), leather:tok('--leather'), storm:tok('--storm'), pad:[tok('--pad1'),tok('--pad2'),tok('--pad3'),tok('--pad4')], p:[tok('--p1'), tok('--p2')] };
const NAMES = ['ORANGE','CYAN'];
const FD = '"Bungee", "Arial Black", Impact, sans-serif';
const FT = '"Chakra Petch", "Trebuchet MS", system-ui, sans-serif';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const LABEL = {BIG:'BIG PADDLE',SHRINK:'SHRINK RAY',SHIELD:'GOAL SHIELD',SMASH:'POWER SMASH',RAPID:'RAPID FIRE',TRIPLE:'TRIPLE SHOT',SPEED:'NITRO',ARMOR:'ARMOR',DOUBLE:'DOUBLE JUMP',DROP:'ROADBLOCK',HOMING:'HOMING SHOTS',REPAIR:'HULL REPAIR',HEAVY:'HEAVYWEIGHT',SHOCK:'SHOCKWAVE'};

const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
let W=0,H=0,S=0,L=0,land=false,DPR=1,U=1,SS=0,SL=0,FK=1,FX=0,FY=0;
var NET=null;
function guestView(){ return !!(NET&&NET.on&&NET.role==='guest'); }

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const angDiff=(a,b)=>{let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;};

/* ---------- coordinates ----------
   Logical frame: width W = short side, height H = long side.
   Player 0 (ORANGE) owns the bottom half, player 1 (CYAN) the top half.
   In landscape the frame is rotated so ORANGE sits on the right. */
function resize(){
  const r=cvs.getBoundingClientRect();
  DPR=Math.min(window.devicePixelRatio||1,2);
  cvs.width=Math.round(r.width*DPR); cvs.height=Math.round(r.height*DPR);
  land=r.width>r.height; SS=Math.min(r.width,r.height); SL=Math.max(r.width,r.height);
  const vd=guestView()&&NET.dims?NET.dims:null; W=vd?vd.W:SS; H=vd?vd.H:SL; S=W; L=H; U=Math.min(W,H/2)/100;
  FK=Math.min(SS/W,SL/H); FX=(SS-W*FK)/2; FY=(SL-H*FK)/2;
  if(game&&!game.net&&!guestView()){ const k=game._k, tg=game.target, gid=game._gid; game=game.rebuild(); game._k=k; game.target=tg; game._gid=gid; }
  if(NET&&NET.on&&NET.role==='host') netSend({t:'dims',W,H});
}
function baseTransform(){ if(land) ctx.setTransform(0,-DPR,DPR,0,0,SS*DPR); else ctx.setTransform(DPR,0,0,DPR,0,0);
  if(guestView()){ ctx.translate(FX,FY); ctx.scale(FK,FK); ctx.translate(W,H); ctx.rotate(Math.PI); } }
function toLogical(e){ const r=cvs.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top; let x=land?SS-py:px, y=land?px:py;
  if(guestView()){ x=W-(x-FX)/FK; y=H-(y-FY)/FK; } return {x,y}; }
function view(p,fn){ ctx.save(); if(p===0) ctx.translate(W/2,H*0.75); else {ctx.translate(W/2,H*0.25); ctx.rotate(Math.PI);} fn(); ctx.restore(); }
function toView(p,x,y){ return p===0?{x:x-W/2,y:y-H*0.75}:{x:W/2-x,y:H*0.25-y}; }
function local(p,x,y){ return p===0?{u:x,v:H-y}:{u:W-x,v:y}; }
function fromLocal(p,u,v){ return p===0?{x:u,y:H-v}:{x:W-u,y:v}; }
function at(p,x,y,fn){ ctx.save(); ctx.translate(x,y); if(p===1) ctx.rotate(Math.PI); fn(); ctx.restore(); }

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){ ctx.beginPath(); if(!(w>0&&h>0)) return; r=Math.max(0,Math.min(r,w/2,h/2)); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function txt(s,x,y,size,font,color,align='center',alpha=1){ ctx.save(); ctx.globalAlpha*=alpha; ctx.font=size+'px '+font; ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline='middle'; ctx.fillText(s,x,y); ctx.restore(); }
function wrap(s,maxW,size,font){ ctx.font=size+'px '+font; const words=s.split(' '); const out=[]; let cur=''; for(const w of words){ const t=cur?cur+' '+w:w; if(ctx.measureText(t).width>maxW&&cur){out.push(cur);cur=w;} else cur=t; } if(cur) out.push(cur); return out; }
let hits=[];
function button(p,id,cx,cy,w,h,label,color,filled,size){
  ctx.save(); rr(cx-w/2,cy-h/2,w,h,h*0.22);
  if(filled){ ctx.fillStyle=color; ctx.shadowColor=color; ctx.shadowBlur=U*4; ctx.fill(); ctx.shadowBlur=0; }
  ctx.lineWidth=Math.max(2,U*0.55); ctx.strokeStyle=color; ctx.stroke(); ctx.restore();
  txt(label,cx,cy+U*0.3,size||U*4.2,FD,filled?COL.bg:color);
  hits.push({p,id,x:cx-w/2,y:cy-h/2,w,h});
}
function arrow(x1,x2,y,s){ ctx.beginPath(); ctx.moveTo(x1,y); ctx.lineTo(x2,y); const d=Math.sign(x2-x1); ctx.moveTo(x2-d*s,y-s); ctx.lineTo(x2,y); ctx.lineTo(x2-d*s,y+s); ctx.stroke(); }
function drawIcon(k,x,y,s,col){
  ctx.save(); ctx.translate(x,y); ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=Math.max(1.5,s*0.15); ctx.lineCap='round'; ctx.lineJoin='round'; const a=s*0.5;
  switch(k){
    case 'BIG': arrow(-a*0.1,-a,0,a*0.35); arrow(a*0.1,a,0,a*0.35); break;
    case 'SHRINK': arrow(-a,-a*0.15,0,a*0.35); arrow(a,a*0.15,0,a*0.35); break;
    case 'SHIELD': case 'ARMOR': ctx.beginPath(); ctx.moveTo(0,-a); ctx.lineTo(a*0.8,-a*0.6); ctx.lineTo(a*0.72,a*0.15); ctx.quadraticCurveTo(a*0.45,a*0.7,0,a); ctx.quadraticCurveTo(-a*0.45,a*0.7,-a*0.72,a*0.15); ctx.lineTo(-a*0.8,-a*0.6); ctx.closePath(); ctx.stroke(); break;
    case 'SMASH': ctx.beginPath(); [[a*0.25,-a],[-a*0.5,a*0.12],[-a*0.02,a*0.12],[-a*0.25,a],[a*0.5,-a*0.12],[a*0.02,-a*0.12]].forEach(([px,py],i)=>i?ctx.lineTo(px,py):ctx.moveTo(px,py)); ctx.closePath(); ctx.fill(); break;
    case 'RAPID': for(let i=-1;i<=1;i++){ rr(-a*0.8,i*a*0.55-a*0.15,a*1.6,a*0.3,a*0.15); ctx.fill(); } break;
    case 'TRIPLE': ctx.beginPath(); [-0.7,0,0.7].forEach(dx=>{ ctx.moveTo(0,a*0.8); ctx.lineTo(dx*a,-a*0.8); }); ctx.stroke(); break;
    case 'SPEED': ctx.beginPath(); [-0.45,0.25].forEach(o=>{ ctx.moveTo((o-0.3)*a,-a*0.7); ctx.lineTo((o+0.3)*a,0); ctx.lineTo((o-0.3)*a,a*0.7); }); ctx.stroke(); break;
    case 'HEAVY': ctx.beginPath(); ctx.moveTo(-a*0.45,-a*0.05); ctx.lineTo(a*0.45,-a*0.05); ctx.lineTo(a*0.75,a*0.85); ctx.lineTo(-a*0.75,a*0.85); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.arc(0,-a*0.3,a*0.38,Math.PI,0); ctx.stroke(); break;
    case 'SHOCK': ctx.beginPath(); ctx.arc(0,0,a*0.25,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(0,0,a*0.6,0,7); ctx.stroke(); ctx.globalAlpha=0.6; ctx.beginPath(); ctx.arc(0,0,a*0.95,0,7); ctx.stroke(); break;
    case 'HOMING': ctx.beginPath(); ctx.arc(0,0,a*0.55,0,7); ctx.moveTo(0,-a); ctx.lineTo(0,-a*0.3); ctx.moveTo(0,a); ctx.lineTo(0,a*0.3); ctx.moveTo(-a,0); ctx.lineTo(-a*0.3,0); ctx.moveTo(a,0); ctx.lineTo(a*0.3,0); ctx.stroke(); break;
    case 'REPAIR': ctx.fillRect(-a*0.22,-a*0.75,a*0.44,a*1.5); ctx.fillRect(-a*0.75,-a*0.22,a*1.5,a*0.44); break;
    case 'DOUBLE': ctx.beginPath(); [-0.45,0.25].forEach(o=>{ ctx.moveTo(-a*0.6,(o+0.35)*a); ctx.lineTo(0,(o-0.25)*a); ctx.lineTo(a*0.6,(o+0.35)*a); }); ctx.stroke(); break;
    case 'DROP': ctx.fillRect(-a*0.55,a*0.2,a*1.1,a*0.75); ctx.beginPath(); ctx.moveTo(0,-a); ctx.lineTo(0,-a*0.05); ctx.moveTo(-a*0.35,-a*0.4); ctx.lineTo(0,-a*0.05); ctx.lineTo(a*0.35,-a*0.4); ctx.stroke(); break;
    case 'GHOST': ctx.beginPath(); ctx.arc(0,-a*0.15,a*0.7,Math.PI,0); ctx.lineTo(a*0.7,a*0.85); ctx.lineTo(a*0.35,a*0.55); ctx.lineTo(0,a*0.85); ctx.lineTo(-a*0.35,a*0.55); ctx.lineTo(-a*0.7,a*0.85); ctx.closePath(); ctx.fill();
      ctx.fillStyle=COL.bg; ctx.beginPath(); ctx.arc(-a*0.27,-a*0.2,a*0.14,0,7); ctx.arc(a*0.27,-a*0.2,a*0.14,0,7); ctx.fill(); break;
    case 'BLAST': ctx.beginPath(); for(let i=0;i<8;i++){ const t=i*Math.PI/4; ctx.moveTo(Math.cos(t)*a*0.3,Math.sin(t)*a*0.3); ctx.lineTo(Math.cos(t)*a,Math.sin(t)*a); } ctx.stroke(); break;
  }

class Pong{

    this.base=W*0.24; this.ph=Math.max(8,U*2.2); this.r=Math.max(6,U*1.7); this.or=Math.max(14,U*4.2);
    this.py=[H-H*0.08,H*0.08]; this.px=[W/2,W/2]; this.tx=[W/2,W/2]; this.wc=[this.base,this.base];
    this.big=[0,0]; this.shr=[0,0]; this.shield=[0,0]; this.smash=[false,false]; this.orb=null; this.orbT=rnd(3,5);
    this.flash=[0,0]; this.endT=-1; this.serve(Math.random()<0.5?0:1); }
  rebuild(){ return new Pong(this.score); }
  pw(p){ return this.base*(this.big[p]>0?1.5:1)*(this.shr[p]>0?0.6:1); }
  serve(to){ this.b={x:W/2,y:H/2,vx:0,vy:0}; this.serveTo=to; this.hold=1.0; this.speed=H*0.55; this.trail=[]; this.last=-1; this.hot=false; }
  down(p,id,x){ this.tx[p]=x; } move(p,id,x){ this.tx[p]=x; } up(){}
  grant(p,k){ sfx.power(); burst(this.orb.x,this.orb.y,COL.pow,24,U*40);
    if(k==='BIG') this.big[p]=9; else if(k==='SHRINK'){ this.shr[1-p]=9; pop(1-p,'SHRUNK!',COL.p[p]); } else if(k==='SHIELD') this.shield[p]=15; else this.smash[p]=true;
    pop(p,LABEL[k]); this.orb=null; this.orbT=rnd(4,7); }
  effects(p){ const e=[]; if(this.big[p]>0) e.push({k:'BIG',t:this.big[p]}); if(this.shr[p]>0) e.push({k:'SHRINK',t:this.shr[p]}); if(this.shield[p]>0) e.push({k:'SHIELD',t:this.shield[p]}); if(this.smash[p]) e.push({k:'SMASH',t:null}); return e; }
  update(dt){
    for(let p=0;p<2;p++){ this.big[p]=Math.max(0,this.big[p]-dt); this.shr[p]=Math.max(0,this.shr[p]-dt); this.shield[p]=Math.max(0,this.shield[p]-dt);
      this.wc[p]+=(this.pw(p)-this.wc[p])*Math.min(1,dt*10);
      const t=clamp(this.tx[p],this.wc[p]/2,W-this.wc[p]/2); this.px[p]+=(t-this.px[p])*Math.min(1,dt*28); this.flash[p]=Math.max(0,this.flash[p]-dt*3); }
    if(NET&&NET.on&&NET.role==='host'){ const H_=this.pxh||(this.pxh=[]), nw=performance.now()/1000; H_.push({t:nw,x:this.px[1]}); while(H_.length&&nw-H_[0].t>0.4) H_.shift(); }
    if(this.endT>=0){ this.endT-=dt; if(this.endT<0) onGameWon(this.winner); return; }
    if(this.orb){ this.orb.t+=dt; if(this.orb.t>11){ this.orb=null; this.orbT=rnd(3,5); } }
    else { this.orbT-=dt; if(this.orbT<=0) this.orb={x:rnd(0.18,0.82)*W,y:rnd(0.36,0.64)*H,k:pick(['BIG','SHRINK','SHIELD','SMASH']),t:0}; }
    if(this.hold>0){ this.hold-=dt; if(this.hold<=0){ const a=rnd(-0.45,0.45), d=this.serveTo===0?1:-1; this.b.vx=Math.sin(a)*this.speed; this.b.vy=Math.cos(a)*this.speed*d; } return; }
    const b=this.b, r=this.r, n=Math.max(1,Math.ceil(Math.hypot(b.vx,b.vy)*dt/(r*0.5))), h=dt/n, gl=U*1.4;
    for(let i=0;i<n;i++){
      b.x+=b.vx*h; b.y+=b.vy*h;
      if(b.x<r){b.x=r;b.vx=Math.abs(b.vx);sfx.wall();} if(b.x>W-r){b.x=W-r;b.vx=-Math.abs(b.vx);sfx.wall();}
      if(this.orb&&this.last>=0&&Math.hypot(b.x-this.orb.x,b.y-this.orb.y)<r+this.or) this.grant(this.last,this.orb.k);
      if(b.vy>0&&b.y+r>=this.py[0]-this.ph/2&&b.y<this.py[0]+this.ph/2&&Math.abs(b.x-this.px[0])<=this.wc[0]/2+r) this.hit(0);
      if(b.vy<0&&b.y-r<=this.py[1]+this.ph/2&&b.y>this.py[1]-this.ph/2){ const hx=this.hitX1(b.x,r); if(hx!=null) this.hit(1,hx); }
      if(b.vy>0&&this.shield[0]>0&&b.y+r>=H-gl){ b.vy=-Math.abs(b.vy); b.y=H-gl-r; this.shield[0]=0; sfx.block(); burst(b.x,H-gl,COL.p[0],20,U*40); }
      if(b.vy<0&&this.shield[1]>0&&b.y-r<=gl){ b.vy=Math.abs(b.vy); b.y=gl+r; this.shield[1]=0; sfx.block(); burst(b.x,gl,COL.p[1],20,U*40); }
      if(b.y>H+r*2){ this.point(1); return; } if(b.y<-r*2){ this.point(0); return; }
    }
    this.trail.push({x:b.x,y:b.y}); if(this.trail.length>16) this.trail.shift();
  }
  hitX1(bx,r){ const w=this.wc[1]/2+r; if(Math.abs(bx-this.px[1])<=w) return this.px[1];
    if(NET&&NET.on&&NET.role==='host'&&this.pxh){ const now=performance.now()/1000, win=Math.min(0.16,0.07+(NET.rtt||0.06)*0.5); for(let i=this.pxh.length-1;i>=0;i--){ const h=this.pxh[i]; if(now-h.t>win) break; if(Math.abs(bx-h.x)<=w) return h.x; } } return null; }
  hit(p,hx){ const b=this.b, off=clamp((b.x-(hx!=null?hx:this.px[p]))/(this.wc[p]/2),-1,1), a=off*1.05;
    this.speed=Math.min(this.speed*1.06,H*1.6); this.hot=this.smash[p]; this.smash[p]=false; const v=this.speed*(this.hot?1.7:1), d=p===0?-1:1;
    b.vx=Math.sin(a)*v; b.vy=Math.cos(a)*v*d; b.y=p===0?this.py[0]-this.ph/2-this.r:this.py[1]+this.ph/2+this.r; this.last=p;
    this.flash[p]=1; if(this.hot){ sfx.boom(); shake(0.2); burst(b.x,b.y,COL.pow,24,U*60); } else { sfx.hit(); burst(b.x,b.y,COL.p[p],8,U*30); } }
  point(p){ this.score[p]++; sfx.point(); shake(0.25); burst(this.b.x,clamp(this.b.y,0,H),COL.p[p],26,U*60);
    if(this.score[p]>=this.target){ this.winner=p; this.endT=1.0; this.b={x:-999,y:-999,vx:0,vy:0}; this.trail=[]; this.hold=99; return; }
    this.serve(1-p); }
  draw(){
    if(this.orb) drawOrb(this.orb.x,this.orb.y,this.or,this.orb.k,this.orb.t);
    const gl=U*1.4;
    for(let p=0;p<2;p++) if(this.shield[p]>0){ const y=p===0?H-gl:gl; ctx.save(); ctx.globalAlpha=this.shield[p]<3?0.4+0.4*Math.sin(this.shield[p]*20):0.85; ctx.shadowColor=COL.p[p]; ctx.shadowBlur=U*3; ctx.strokeStyle=COL.p[p]; ctx.lineWidth=U*0.8; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); ctx.restore(); }
    const lk=this.last>=0?eqOf(this.last,'pong'):'', bc=this.hot?COL.pow:(lk==='pong-comet'||lk==='pong-plasma')?COL.p[this.last]:COL.ink, tt=performance.now()/1000;
    ctx.save(); ctx.globalCompositeOperation='lighter';
    this.trail.forEach((t,i)=>{ ctx.globalAlpha=(i/this.trail.length)*(this.hot?0.6:0.35); ctx.fillStyle=bc; ctx.beginPath(); ctx.arc(t.x,t.y,this.r*(0.4+0.6*i/this.trail.length),0,7); ctx.fill(); });
    ctx.restore();
    if(this.b.x>-900){ ctx.save(); ctx.shadowColor=bc; ctx.shadowBlur=U*(this.hot?7:4); ctx.fillStyle=bc; ctx.beginPath(); ctx.arc(this.b.x,this.b.y,this.r,0,7); ctx.fill(); ctx.restore(); }
    for(let p=0;p<2;p++){ drawPaddleSkin(ctx,eqOf(p,'pong'),this.px[p]-this.wc[p]/2,this.py[p]-this.ph/2,this.wc[p],this.ph,COL.p[p],tt,U*(3+this.flash[p]*6+(this.smash[p]?4:0)));
      if(this.smash[p]){ ctx.save(); ctx.strokeStyle=COL.pow; ctx.globalAlpha=0.7; ctx.lineWidth=2; rr(this.px[p]-this.wc[p]/2-2,this.py[p]-this.ph/2-2,this.wc[p]+4,this.ph+4,this.ph); ctx.stroke(); ctx.restore(); }
      if(this.hold>0&&this.hold<90&&this.serveTo===p){ const pt=fromLocal(p,W/2,H*0.2); at(p,pt.x,pt.y,()=>txt('INCOMING',0,0,U*3,FT,COL.p[p],'center',0.7)); } }
  }
  hint(p){ const pt=fromLocal(p,W/2,H*0.035); at(p,pt.x,pt.y,()=>txt(solo?'SLIDE ANYWHERE TO MOVE':'SLIDE ANYWHERE IN YOUR HALF',0,0,U*2.6,FT,COL.dim,'center',0.8)); }
}

/* ================= GAME 2: TANKS ================= */
const OBST=[[0.40,0.475,0.20,0.05],[0.10,0.28,0.24,0.035],[0.66,0.685,0.24,0.035],[0.72,0.19,0.05,0.13],[0.23,0.68,0.05,0.13],[0,0.47,0.12,0.06],[0.88,0.47,0.12,0.06]];
const CRATES=[[0.30,0.42],[0.70,0.58],[0.50,0.30],[0.50,0.70],[0.12,0.62],[0.88,0.38]];
const TANK_HP=3, STORM_AT=15;
function pushOut(o,r,rc){ const cx=clamp(o.x,rc.x,rc.x+rc.w), cy=clamp(o.y,rc.y,rc.y+rc.h); const dx=o.x-cx, dy=o.y-cy, d2=dx*dx+dy*dy;
  if(d2>=r*r) return; if(d2>1e-6){ const d=Math.sqrt(d2); o.x=cx+dx/d*r; o.y=cy+dy/d*r; return; }
  const l=o.x-rc.x, ri=rc.x+rc.w-o.x, t=o.y-rc.y, b=rc.y+rc.h-o.y, m=Math.min(l,ri,t,b);
  if(m===l)o.x=rc.x-r; else if(m===ri)o.x=rc.x+rc.w+r; else if(m===t)o.y=rc.y-r; else o.y=rc.y+rc.h+r; }
class Tank{
  constructor(score){ this.target=3; this.score=score||[0,0]; this.r=Math.max(12,S*0.034); this.br=Math.max(3.5,S*0.009); this.or=Math.max(13,U*3.8);
    this.rects=OBST.map(([x,y,w,h])=>({x:x*W,y:y*H,w:w*W,h:h*H})); this.ctrl=[{},{}]; this.endT=-1; this.clock=0; this.slow=0; this.reset(); }
  rebuild(){ return new Tank(this.score); }
  reset(){ const fx=()=>({RAPID:0,TRIPLE:0,SPEED:0,HOMING:0,ARMOR:false});
    const mk=(y,a)=>({x:W/2,y:H*y,a,alive:true,cd:0,fx:fx(),hp:TANK_HP,inv:1.2,dash:0,dashCd:0,recoil:0,stormT:0,flash:0});
    this.t=[mk(0.88,-Math.PI/2),mk(0.12,Math.PI/2)];
    const cs=S*0.07; this.crates=CRATES.map(([x,y])=>({x:x*W-cs/2,y:y*H-cs/2,w:cs,h:cs,hp:2,shake:0}));
    this.bul=[]; this.pause=0; this.ctrl=[{},{}]; this.orbs=[]; this.orbT=rnd(2.5,4); this.rt=0; this.warned=0; this.ghosts=[]; }
  solids(){ return this.rects.concat(this.crates); }
  inset(){ return this.rt<STORM_AT?0:Math.min(W*0.3,(this.rt-STORM_AT)*U*3.2); }
  down(p,id,x,y){ const c=this.ctrl[p], l=local(p,x,y); if(l.u<W/2){ if(!c.joy) c.joy={id,ox:x,oy:y,x,y,t0:this.clock,moved:0}; } else if(!c.fire){ c.fire={id}; this.shoot(p); } }
  move(p,id,x,y){ const j=this.ctrl[p].joy; if(j&&j.id===id){ j.moved=Math.max(j.moved,Math.hypot(x-j.ox,y-j.oy)); j.x=x; j.y=y; } }
  up(p,id){ const c=this.ctrl[p]; if(c.joy&&c.joy.id===id){ if(this.clock-c.joy.t0<0.22&&c.joy.moved<U*3) this.dash(p); c.joy=null; } if(c.fire&&c.fire.id===id) c.fire=null; }
  dash(p){ const t=this.t[p]; if(!t.alive||t.dashCd>0||this.pause>0||this.endT>=0) return; t.dash=0.18; t.dashCd=2.2; t.inv=Math.max(t.inv,0.3); sfx.dash(); }
  free(x,y,m){ if(x<m||y<m||x>W-m||y>H-m) return false; for(const rc of this.solids()) if(x>rc.x-m&&x<rc.x+rc.w+m&&y>rc.y-m&&y<rc.y+rc.h+m) return false; return true; }
  shoot(p){ const t=this.t[p]; if(!t.alive||t.cd>0||this.pause>0||this.endT>=0) return; const fx=t.fx;
    const lim=(fx.RAPID>0||fx.TRIPLE>0)?7:3, angs=fx.TRIPLE>0?[-0.24,0,0.24]:[0], hom=fx.HOMING>0; let n=this.bul.filter(b=>b.o===p).length; if(n>=lim) return;
    const v=S*0.8; let fired=false;
    for(const da of angs){ if(n>=lim) break; const a=t.a+da, tx=t.x+Math.cos(a)*this.r*1.55, ty=t.y+Math.sin(a)*this.r*1.55; if(!this.free(tx,ty,0)) continue;
      this.bul.push({id:(this.bid=(this.bid||0)+1),x:tx,y:ty,vx:Math.cos(a)*v,vy:Math.sin(a)*v,o:p,bn:0,age:0,hom}); n++; fired=true; }
    if(fired){ if(hom) fx.HOMING--; t.cd=fx.RAPID>0?0.13:0.42; t.recoil=1; sfx.shoot();
      burst(t.x+Math.cos(t.a)*this.r*1.6,t.y+Math.sin(t.a)*this.r*1.6,COL.pow,5,U*18); } }
  effects(p){ const fx=this.t[p].fx, e=[]; ['RAPID','TRIPLE','SPEED'].forEach(k=>{ if(fx[k]>0) e.push({k,t:fx[k]}); }); if(fx.HOMING>0) e.push({k:'HOMING',n:fx.HOMING}); if(fx.ARMOR) e.push({k:'ARMOR',n:1}); return e; }
  grant(p,o){ const t=this.t[p], fx=t.fx; o.taken=true; sfx.power(); burst(o.x,o.y,COL.pow,24,U*40); pop(p,LABEL[o.k]);
    if(o.k==='ARMOR') fx.ARMOR=true; else if(o.k==='HOMING') fx.HOMING=3; else if(o.k==='REPAIR') t.hp=Math.min(TANK_HP,t.hp+1); else fx[o.k]=o.k==='TRIPLE'?8:7; }
  update(dt){
    this.clock+=dt; if(this.slow>0){ this.slow-=dt; dt*=0.3; }
    this.ghosts.forEach(g=>g.life-=dt); this.ghosts=this.ghosts.filter(g=>g.life>0); this.crates.forEach(c=>c.shake=Math.max(0,c.shake-dt*5));
    if(this.endT>=0){ this.endT-=dt; this.moveBullets(dt); if(this.endT<0) onGameWon(this.winner); return; }
    if(this.pause>0){ this.pause-=dt; this.moveBullets(dt); if(this.pause<=0) this.reset(); return; }
    this.rt+=dt;
    if(this.warned===0&&this.rt>STORM_AT-5){ this.warned=1; pop(0,'STORM IN 5',COL.storm); pop(1,'STORM IN 5',COL.storm); sfx.alarm(); }
    if(this.warned===1&&this.rt>STORM_AT){ this.warned=2; pop(0,'THE STORM CLOSES IN',COL.storm); pop(1,'THE STORM CLOSES IN',COL.storm); sfx.alarm(); }
    const ins=this.inset();
    this.orbT-=dt;
    if(this.orbT<=0&&this.orbs.length<2){ this.orbT=rnd(4,7);
      for(let i=0;i<40;i++){ const x=rnd(Math.max(0.08*W,ins+this.or),Math.min(0.92*W,W-ins-this.or)), y=rnd(Math.max(0.2*H,ins+this.or),Math.min(0.8*H,H-ins-this.or));
        if(this.free(x,y,this.or*1.3)&&this.t.every(t=>Math.hypot(t.x-x,t.y-y)>this.r*5)){ this.orbs.push({x,y,k:pick(['RAPID','TRIPLE','SPEED','ARMOR','HOMING','REPAIR']),t:0}); break; } } }
    const R=U*9;
    for(let p=0;p<2;p++){ const t=this.t[p], c=this.ctrl[p], fx=t.fx;
      t.cd-=dt; t.dashCd=Math.max(0,t.dashCd-dt); t.inv=Math.max(0,t.inv-dt); t.recoil=Math.max(0,t.recoil-dt*6); t.flash=Math.max(0,t.flash-dt*4);
      ['RAPID','TRIPLE','SPEED'].forEach(k=>fx[k]=Math.max(0,fx[k]-dt));
      if(!t.alive) continue;
      if(c.fire) this.shoot(p);
      const spd=S*0.3*(fx.SPEED>0?1.6:1);
      if(c.joy){ let dx=c.joy.x-c.joy.ox, dy=c.joy.y-c.joy.oy; const m=Math.hypot(dx,dy);
        if(m>R){ c.joy.ox=c.joy.x-dx/m*R; c.joy.oy=c.joy.y-dy/m*R; }
        if(m>U*1.5&&t.dash<=0){ const ta=Math.atan2(dy,dx), d=angDiff(t.a,ta), turn=10*dt; t.a+=clamp(d,-turn,turn);
          const k=Math.min(1,m/R), al=Math.cos(angDiff(t.a,ta)); if(al>0.2){ t.x+=Math.cos(t.a)*spd*k*al*dt; t.y+=Math.sin(t.a)*spd*k*al*dt; } } }
      if(t.dash>0){ t.dash-=dt; t.x+=Math.cos(t.a)*S*1.15*dt; t.y+=Math.sin(t.a)*S*1.15*dt; this.ghosts.push({x:t.x,y:t.y,a:t.a,p,life:0.25}); }
      for(const rc of this.solids()) pushOut(t,this.r,rc);
      t.x=clamp(t.x,this.r,W-this.r); t.y=clamp(t.y,this.r,H-this.r);
      if(ins>0&&(t.x<ins||t.x>W-ins||t.y<ins||t.y>H-ins)){ t.stormT+=dt; if(t.stormT>=1.0){ t.stormT=0; this.damage(p,null); } } else t.stormT=0;
      if(t.alive&&t.hp===1&&Math.random()<dt*10) parts.push({x:t.x+rnd(-1,1)*this.r*0.4,y:t.y+rnd(-1,1)*this.r*0.4,vx:rnd(-1,1)*U*4,vy:rnd(-1,1)*U*4,life:0.8,max:0.8,col:COL.dim,sz:U*1.4});
      for(const o of this.orbs) if(!o.taken&&t.alive&&Math.hypot(o.x-t.x,o.y-t.y)<this.r+this.or) this.grant(p,o); }
    this.orbs=this.orbs.filter(o=>!o.taken); this.orbs.forEach(o=>o.t+=dt);
    const a=this.t[0], b=this.t[1];
    if(a.alive&&b.alive){ const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1, ov=this.r*2-d; if(ov>0){ a.x-=dx/d*ov/2; a.y-=dy/d*ov/2; b.x+=dx/d*ov/2; b.y+=dy/d*ov/2; } }
    this.moveBullets(dt,true);
  }
  moveBullets(dt,live){ const br=this.br;
    for(const bl of this.bul){ bl.age+=dt;
      if(bl.hom&&bl.age>0.12){ const tg=this.t[1-bl.o]; if(tg.alive){ const cur=Math.atan2(bl.vy,bl.vx), des=Math.atan2(tg.y-bl.y,tg.x-bl.x), na=cur+clamp(angDiff(cur,des),-3.2*dt,3.2*dt), v=Math.hypot(bl.vx,bl.vy); bl.vx=Math.cos(na)*v; bl.vy=Math.sin(na)*v; } }
      const n=Math.max(1,Math.ceil(Math.hypot(bl.vx,bl.vy)*dt/br)), h=dt/n;
      for(let i=0;i<n&&!bl.dead;i++){ const px=bl.x, py=bl.y; bl.x+=bl.vx*h; bl.y+=bl.vy*h; let hitWall=false;
        if(bl.x<br){bl.x=br;bl.vx=Math.abs(bl.vx);hitWall=true;} if(bl.x>W-br){bl.x=W-br;bl.vx=-Math.abs(bl.vx);hitWall=true;}
        if(bl.y<br){bl.y=br;bl.vy=Math.abs(bl.vy);hitWall=true;} if(bl.y>H-br){bl.y=H-br;bl.vy=-Math.abs(bl.vy);hitWall=true;}
        for(const c of this.crates){ if(c.hp>0&&bl.x>c.x-br&&bl.x<c.x+c.w+br&&bl.y>c.y-br&&bl.y<c.y+c.h+br){ bl.dead=true; c.hp--; c.shake=1; sfx.wall(); burst(bl.x,bl.y,COL.dim,6,U*20);
            if(c.hp<=0){ sfx.crate(); burst(c.x+c.w/2,c.y+c.h/2,COL.edge,26,U*50); if(Math.random()<0.4) this.orbs.push({x:c.x+c.w/2,y:c.y+c.h/2,k:pick(['RAPID','TRIPLE','HOMING','REPAIR','ARMOR']),t:0}); } break; } }
        if(bl.dead) break;
        if(!hitWall) for(const rc of this.rects){ if(bl.x>rc.x-br&&bl.x<rc.x+rc.w+br&&bl.y>rc.y-br&&bl.y<rc.y+rc.h+br){
          if(px<=rc.x-br||px>=rc.x+rc.w+br){ bl.vx*=-1; bl.x=px; } else { bl.vy*=-1; bl.y=py; } hitWall=true; break; } }
        if(hitWall){ bl.bn++; if(bl.bn>2){ bl.dead=true; burst(bl.x,bl.y,COL.p[bl.o],4,U*15); } else sfx.bounce(); }
        if(live) for(let q=0;q<2&&!bl.dead;q++){ const t=this.t[q]; if(!t.alive) continue; if(q===bl.o&&bl.age<0.25) continue;

function drawRunnerSprite(g,sk,x,y,px,col,legs,t){ const rows=SPRITE.top.concat(legs), P=(i,j,c)=>{ g.fillStyle=c; g.fillRect(x+i*px,y+j*px,px+0.5,px+0.5); };

function deleteProfile(id){ DB.profiles=DB.profiles.filter(p=>p.id!==id); for(const k in DB.seat) DB.seat[k]=(DB.seat[k]||[]).map(x=>x===id?null:x); dbSave(); }
const guestSeat=p=>({kind:'guest',id:null,name:NAMES[p],av:'guest',eq:{}});

function restoreSeat(mode,p,lp){ const id=(DB.seat[mode]||[])[p], pr=profById(id); return pr?seatFromProfile(pr):guestSeat(lp==null?p:lp); }

const DEFT={pong:5,tank:3,sumo:5,run:3,draw:5,echo:3,paint:2,beat:2};
const CLASSIC=['pong','tank','sumo','run','draw'], ALL8=['pong','echo','tank','paint','sumo','beat','run','draw'];
const classicLineup=()=>CLASSIC.map(k=>({k,t:null})), allLineup=()=>ALL8.map(k=>({k,t:null}));
function currentLineup(){ const L=DB.lineup; if(L.mode==='all') return allLineup(); if(L.mode==='custom'&&L.custom.length) return L.custom.map(x=>({k:x.k,t:x.t||null})); return classicLineup(); }

/* ---------- points, daily board, stats ---------- */
const CR={mid:null,n:0,fin:false,game:[0,0],total:[0,0]};
function todayKey(d){ d=d||new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function rankDay(D){ return Object.entries(D.stats).map(([id,s])=>Object.assign({id},s)).sort((a,b)=>b.g-a.g||b.m-a.m||b.pts-a.pts); }
function dayRoll(){ const k=todayKey(), D=DB.daily; if(D.date===k) return D; let champ=null; const y=new Date(); y.setDate(y.getDate()-1);
  if(D.date===todayKey(y)){ const top=rankDay(D)[0]; if(top&&top.g>0) champ={date:D.date,name:top.name,av:top.av,frame:top.frame,g:top.g}; }
  DB.daily={date:k,stats:{},champ}; dbSave(); return DB.daily; }
function dayStat(pr){ const D=dayRoll(); let s=D.stats[pr.id]; if(!s) s=D.stats[pr.id]={g:0,m:0,pts:0,draw:null,run:0}; s.name=pr.name.toUpperCase(); s.av=pr.av; s.frame=pr.eq.frame||'frame-classic'; return s; }
function giveProfilePts(pr,pts){ if(!pr||!pts) return; pr.pts+=pts; dayStat(pr).pts+=pts; dbSave(); }
function addPts(p,pts){ const pr=profById(seats[p].id); if(!pr) return; giveProfilePts(pr,pts); CR.game[p]+=pts; CR.total[p]+=pts; }
function creditTick(){ if(!match||!match.id) return;
  if(CR.mid!==match.id){ CR.mid=match.id; CR.n=0; CR.fin=false; CR.game=[0,0]; CR.total=[0,0]; }
  const bot=MODE==='bot';
  while(CR.n<match.history.length){ const w=match.history[CR.n++]; CR.game=[0,0]; if(w==null||w<0) continue;
    for(let p=0;p<2;p++) if(isLocalHuman(p)){ const won=w===p; let pts=5+(won?10:0); if(bot) pts=Math.ceil(pts/2); addPts(p,pts); if(won&&!bot) dayStat(profById(seats[p].id)).g++; } }
  if(scene==='final'&&!CR.fin){ CR.fin=true; const l=leader(); if(l>=0&&isLocalHuman(l)){ CR.game=[0,0]; addPts(l,bot?12:25); if(!bot) dayStat(profById(seats[l].id)).m++; } dbSave(); } }
function statHook(kind,p,v){ if(!isLocalHuman(p)) return; const s=dayStat(profById(seats[p].id));
  if(kind==='draw'){ if(s.draw==null||v<s.draw) s.draw=v; } else if(kind==='run'){ if(v>s.run) s.run=v; } dbSave(); }

/* ---------- tournaments: round robin for 3–6 players, knockout for 7+ ---------- */
const Tour={ cur:null,
  active(){ return !!(DB.tour&&!DB.tour.done); },
  pname(id){ const p=profById(id); return p?p.name.toUpperCase():((DB.tour&&DB.tour.names[id])||'PLAYER'); },
  pav(id){ const p=profById(id); return p?p.av:((DB.tour&&DB.tour.avs[id])||'guest'); },
  pfr(id){ const p=profById(id); return p&&p.eq.frame||'frame-classic'; },
  create(ids,third,lineup){ const ps=shuffle(ids), t={id:newId(),fmt:ps.length<=6?'rr':'ko',players:ps,lineup:lineup.map(x=>({k:x.k,t:x.t||null})),third:!!third,fx:[],played:0,done:false,champ:null,second:null,names:{},avs:{}};
    ps.forEach(id=>{ const p=profById(id); t.names[id]=p?p.name.toUpperCase():'PLAYER'; t.avs[id]=p?p.av:'guest'; });
    if(t.fmt==='rr'){ const a=ps.slice(); if(a.length%2) a.push(null); const n=a.length;
      for(let r=0;r<n-1;r++){ for(let i=0;i<n/2;i++){ let x=a[i], y=a[n-1-i]; if(x&&y){ if((r+i)%2) [x,y]=[y,x]; t.fx.push({a:x,b:y,r,res:null,g:null}); } } a.splice(1,0,a.pop()); } }
    else { let size=8; while(size<ps.length) size*=2; const byes=size-ps.length, real=[], bye=[]; let k=0;
      for(let i=0;i<size/2;i++){ if(i<byes) bye.push([ps[k++],'BYE']); else real.push([ps[k++],ps[k++]]); }
      let prev=[]; const first=[]; while(bye.length||real.length){ if(real.length) first.push(real.shift()); if(bye.length) first.push(bye.shift()); }
      first.forEach(([x,y])=>{ t.fx.push({a:x,b:y,r:0,res:null,g:null}); prev.push(t.fx.length-1); });
      const rounds=Math.log2(size);
      for(let r=1;r<rounds;r++){ const cur=[]; for(let j=0;j<prev.length/2;j++){ t.fx.push({a:null,b:null,sa:prev[2*j],sb:prev[2*j+1],take:'w',r,res:null,g:null}); cur.push(t.fx.length-1); }
        if(r===rounds-1&&t.third){ const fin=t.fx.pop(); t.fx.push({a:null,b:null,sa:prev[0],sb:prev[1],take:'l',r,third:true,res:null,g:null}); t.fx.push(fin); cur[0]=t.fx.length-1; }
        prev=cur; } }
    Tour.resolve(t); DB.tour=t; dbSaveNow(); return t; },
  resolve(t){ t=t||DB.tour; let ch=true;
    while(ch){ ch=false; for(const f of t.fx){
      if(f.sa!=null){ const A=t.fx[f.sa].res, B=t.fx[f.sb].res, na=A?(f.take==='w'?A.w:A.l):null, nb=B?(f.take==='w'?B.w:B.l):null; if(f.a!==na||f.b!==nb){ f.a=na; f.b=nb; ch=true; } }
      if(!f.res&&f.a&&f.b&&(f.a==='BYE'||f.b==='BYE')){ f.res={w:f.a==='BYE'?f.b:f.a,l:'BYE',bye:true}; ch=true; } } } },
  nextIdx(){ const t=DB.tour; return t?t.fx.findIndex(f=>!f.res&&f.a&&f.b):-1; },
  total(){ return DB.tour.fx.filter(f=>!(f.res&&f.res.bye)).length; },
  playedCount(){ return DB.tour.fx.filter(f=>f.res&&!f.res.bye).length; },
  table(){ const t=DB.tour, S={}; t.players.forEach(id=>S[id]={id,w:0,l:0,pl:0,df:0});
    for(const f of t.fx) if(f.res&&!f.res.bye&&!f.tb&&S[f.res.w]&&S[f.res.l]){ const a=S[f.res.w], b=S[f.res.l]; a.w++; b.l++; a.pl++; b.pl++; a.df+=f.res.sw-f.res.sl; b.df+=f.res.sl-f.res.sw; }
    return Object.values(S).sort((a,b)=>b.w-a.w||b.df-a.df); },
  play(){ const i=Tour.nextIdx(); if(i<0) return; const t=DB.tour, f=t.fx[i];
    if(!f.g){ f.g=t.lineup[t.played%t.lineup.length]; dbSave(); }
    MODE='tour'; solo=false; const mk=(id,p)=>{ const pr=profById(id); return pr?seatFromProfile(pr):{kind:'guest',id:null,name:Tour.pname(id),av:Tour.pav(id),eq:{}}; };
    seats=[mk(f.a,0),mk(f.b,1)]; Tour.cur=i; match={id:newId(),wins:[0,0],gi:0,history:[],scores:[],lineup:[f.g]}; toIntro(); UI.sync(); },
  record(i,side,score){ const t=DB.tour, f=t.fx[i]; if(!f||f.res) return; score=score||[0,0];
    f.res={w:side===0?f.a:f.b,l:side===0?f.b:f.a,sw:score[side],sl:score[1-side]}; t.played++; Tour.resolve(t); Tour.checkEnd(); dbSaveNow(); },
  checkEnd(){ const t=DB.tour; if(Tour.nextIdx()>=0) return;
    if(t.fmt==='rr'){ const tb=t.fx.find(f=>f.tb);
      if(tb&&tb.res){ t.champ=tb.res.w; t.second=tb.res.l; }
      else { const tab=Tour.table(); if(tab.length>1&&tab[0].w===tab[1].w){ t.fx.push({a:tab[0].id,b:tab[1].id,r:99,tb:true,res:null,g:{k:'draw',t:3}}); return; } t.champ=tab[0].id; t.second=tab[1]?tab[1].id:null; } }
    else { const fin=t.fx[t.fx.length-1]; t.champ=fin.res.w; t.second=fin.res.l; const th=t.fx.find(f=>f.third); t.thirdP=th&&th.res?th.res.w:null; }
    t.done=true; giveProfilePts(profById(t.champ),100); giveProfilePts(profById(t.second),40); }
};

/* ================= MATCH FLOW ================= */
let scene='home', sceneT=0, game=null, paused=false, countdown=0, goT=-1, lastCount=0, introStage=0;
let MODE='duel';
let match={id:null,wins:[0,0],gi:0,history:[],scores:[],lineup:classicLineup()};
let ready=[false,false];
const INTRO_T=REDUCED?0:2.1;
function startMatch(){ match={id:newId(),wins:[0,0],gi:0,history:[],scores:[],lineup:currentLineup()}; toIntro(); }
function toIntro(){ scene='intro'; game=null; ready=[false,false]; goT=-1; sceneT=0; introStage=0; parts=[]; pops=[]; }
function startGame(){ const it=curItem(), k=it.k; game=MAKERS[k]([0,0]); game._k=k; game._gid=newId(); if(it.t) game.target=it.t;
  if(NET&&NET.on&&NETLOCAL.has(k)) game.netInit(0,(Math.random()*2147483647)|0);
  scene='countdown'; countdown=3; lastCount=4; sceneT=0; parts=[]; pops=[]; }
function onGameWon(w){ match.wins[w]++; match.history.push(w); match.scores.push(game?game.score.slice():[0,0]); scene='gameEnd'; sceneT=0; sfx.win(); }
function afterGameEnd(){
  if(MODE==='tour'&&Tour.cur!=null){ const i=Tour.cur; Tour.cur=null; Tour.record(i,match.history[0],match.scores[0]); toHub(); return; }
  if(match.gi>=LU().length-1){ scene='final'; ready=[false,false]; goT=-1; sceneT=0; game=null; } else { match.gi++; toIntro(); } }
function skipGame(){ if(MODE==='tour') return; paused=false; game=null; ptrs.clear(); match.history.push(-1); match.scores.push(null); afterGameEnd(); }
function goHome(){ scene='home'; game=null; paused=false; ready=[false,false]; goT=-1; parts=[]; pops=[]; Tour.cur=null; if(MODE!=='online') MODE='duel'; solo=false; UI.sync(); }
function toSeats(){ scene='seats'; game=null; paused=false; ready=[false,false]; goT=-1; sceneT=0; parts=[]; pops=[]; seatPage=[0,0]; refreshSeat(0); refreshSeat(1); UI.sync(); }
function toHub(){ scene='hub'; game=null; paused=false; ready=[false,false]; MODE='tour'; solo=false; Tour.cur=null; UI.sync(); }
function toTitle(){ if(NET&&NET.on) toSeats(); else if(MODE==='tour'&&Tour.active()) toHub(); else goHome(); }
function beginLocal(mode){ MODE=mode; solo=mode==='bot'; seats=[restoreSeat(mode,0), solo?botSeat():restoreSeat(mode,1)];
  if(!solo&&seats[1].id&&seats[1].id===seats[0].id) seats[1]=guestSeat(1); toSeats(); }
function chooseSeat(p,id){ const pr=id==='guest'?null:profById(id); seats[p]=pr?seatFromProfile(pr):guestSeat(p); ready[p]=false; sfx.tap(); rememberSeats();
  if(guestView()) netSend({t:'seat',s:pubSeat(seats[p])}); }
const leader=()=>match.wins[0]>match.wins[1]?0:match.wins[1]>match.wins[0]?1:-1;
let attract=null, MUTE=false;
function attractTick(dt){ if(!attract||attract._w!==W||attract._h!==H){ attract=new Pong([0,0]); attract.target=1e9; attract._w=W; attract._h=H; }
  MUTE=true; const sp=parts.length; try{ attract.ai(0,dt,1); attract.ai(1,dt,1); attract.update(dt); }catch(e){} finally{ MUTE=false; } parts.length=Math.min(parts.length,sp+40); }

function update(dt){
  UI.sync(); sceneT+=dt; if(shakeT>0) shakeT-=dt; updParts(dt);
  const inG=scene==='countdown'||scene==='play'||scene==='gameEnd';
  Music.set(scene==='play'&&game&&game.silent?null:inG?curDef().song:'menu');
  if(guestView()){ netGuestTick(dt); creditTick(); return; }
  if(NET&&NET.on) netHostTick(dt);
  creditTick();
  if(scene==='home'||scene==='hub'){ attractTick(dt); return; }
  if(paused) return;
  if(scene==='intro'){ if(introStage===0&&!REDUCED){ introStage=1; sfx.whoosh(); } if(introStage===1&&sceneT>0.62){ introStage=2; sfx.slam(); } }
  if(scene==='seats'||scene==='intro'||scene==='final'){ if(solo) ready[1]=true;
    if(ready[0]&&ready[1]){ if(goT<0) goT=0.45; goT-=dt; if(goT<=0){ goT=-1; if(scene==='intro') startGame(); else startMatch(); } } else goT=-1; }
  else if(scene==='countdown'){ countdown-=dt; const c=Math.ceil(countdown); if(c!==lastCount&&c>0){ lastCount=c; sfx.count(); } if(countdown<=0){ scene='play'; sfx.go(); } }
  else if(scene==='play'){ if(solo&&game.ai) game.ai(1,dt,level); game.update(dt); }
  else if(scene==='gameEnd'){ if(game) game.update(0); if(sceneT>3.2) afterGameEnd(); }
}

function backdrop(){

function drawIntroCard(p,T,g){ const col=COL.p[p], oc=COL.p[1-p];

const ptrs=new Map(), sliders=new Map();
function setVolFromHit(h,vx){ const v=clamp((vx-h.sx)/h.sw,0,1); setVol(h.id==='vol-m'?'m':'s',Math.round(v*20)/20); }
cvs.addEventListener('pointerdown',e=>{ e.preventDefault(); audioInit(); wake(); try{cvs.setPointerCapture(e.pointerId);}catch(_){}
  if(scene==='home'||scene==='hub') return;
  const {x,y}=toLogical(e);
  const m=MB(); if(Math.hypot(x-m.x,y-m.y)<m.r*1.5){ Music.toggle(); sfx.tap(); return; }
  if((scene==='play'||scene==='countdown')&&!paused){ const b=PB(); if(Math.hypot(x-b.x,y-b.y)<b.r*1.5){ paused=true; if(guestView()) netSend({t:'a',a:'pause'}); sfx.tap(); return; } }
  const rp=remoteP(), owner=(rp>=0&&scene==='play'&&!paused)?LP():(y>H/2?0:1);
  if(NET&&NET.on&&owner===rp) return;
  ptrs.set(e.pointerId,owner);
  const v=toView(owner,x,y); const hit=hits.find(h=>h.p===owner&&v.x>=h.x&&v.x<=h.x+h.w&&v.y>=h.y&&v.y<=h.y+h.h);
  const gv=guestView();
  if(paused){ if(!hit) return;
    if(hit.id==='vol-m'||hit.id==='vol-s'){ sliders.set(e.pointerId,{h:hit,owner}); setVolFromHit(hit,v.x); return; }
    sfx.tap();
    if(hit.id==='resume'){ paused=false; if(gv) netSend({t:'a',a:'resume'}); } else if(hit.id==='skip'){ if(gv) netSend({t:'a',a:'skip'}); else skipGame(); } else if(hit.id==='quit'){ if(gv) netSend({t:'a',a:'menu'}); else toTitle(); } return; }
  if(scene==='intro'&&sceneT<INTRO_T){ sceneT=INTRO_T; return; }
  if(hit){ const id=hit.id;
    if(id==='ready'){ ready[owner]=!ready[owner]; if(gv) netSend({t:'a',a:'ready'}); sfx.tap(); }
    else if(id==='menu'){ sfx.tap(); if(gv) netSend({t:'a',a:'menu'}); else toTitle(); }
    else if(id==='back'){ sfx.tap(); if(NET&&NET.on) netLeave('You left the lobby.'); else goHome(); }
    else if(id.startsWith('seat:')) chooseSeat(owner,id.slice(5));
    else if(id==='seatnew'){ sfx.tap(); UI.editProfile(null,owner===1&&!(NET&&NET.on),pr=>chooseSeat(owner,pr.id)); }
    else if(id==='seatmore'){ seatPage[owner]++; sfx.tap(); }
    return; }
  if(scene==='play'&&game){ if(gv&&!game.net){ netSend({t:'i',k:'d',id:e.pointerId,x,y}); if(game._k==='pong') NET.localX=x;
      if(game._k==='echo'&&game.state==='input'&&game.turn===LP()){ const pi=game.padAt(LP(),x,y); if(pi>=0){ NET.echoLocal={i:pi,at:performance.now()}; padSound(pi,0.2); } } }
    else game.down(owner,e.pointerId,x,y); }
},{passive:false});

  if(!ptrs.has(e.pointerId)||paused||scene!=='play'||!game) return; e.preventDefault(); const {x,y}=toLogical(e);
  if(guestView()&&!game.net){ if(game._k!=='draw'){ netSend({t:'i',k:'m',id:e.pointerId,x,y}); if(game._k==='pong') NET.localX=x; } } else game.move(ptrs.get(e.pointerId),e.pointerId,x,y); },{passive:false});

    else if(a==='tp'){ const id=b.dataset.id; if(SU.sel.has(id)) SU.sel.delete(id); else SU.sel.add(id); }
    else if(a==='tpnew'){ editProfile(null,false,pr=>{ SU.sel.add(pr.id); renderSetup(); }); return; }
    else if(a==='go'){ commitLineup(); close('setup'); beginLocal(SU.mode); return; }
    else if(a==='create'){ commitLineup(); close('setup'); NetUI.openWait('Creating lobby…'); netCreate(); return; }
    else if(a==='tourgo'){ if(SU.sel.size<3) return; commitLineup(); DB.seat.tourSel=[...SU.sel]; Tour.create([...SU.sel],SU.third,lineupNow()); close('setup'); toHub(); return; }
    else return;
    sfx.tap(); renderSetup(); });
  $('setup').addEventListener('change',e=>{ if(e.target.dataset.act==='third'){ SU.third=e.target.checked; renderSetup(); } });
  $('setup').addEventListener('submit',e=>{ e.preventDefault(); const code=($('su-code')||{}).value; commitLineup(); close('setup'); NetUI.openWait('Connecting…'); netJoin(code); });

  /* profile editor */
  let PE=null;
  function editProfile(pr,flip,cb){ PE={pr,cb,av:pr?pr.av:AVATARS[Math.floor(Math.random()*AVATARS.length)].id}; $('pedit-t').textContent=pr?'Edit profile':'New profile';
    $('pedit-name').value=pr?pr.name:''; $('pedit-err').textContent=''; $('pedit-card').classList.toggle('flip',!!flip); renderAv(); open('pedit'); setTimeout(()=>{ try{ $('pedit-name').focus({preventScroll:true}); }catch(e){} },60); }
  function renderAv(){ $('pedit-av').innerHTML=AVATARS.map(a=>`<button type="button" class="avb" data-av="${a.id}" aria-pressed="${PE.av===a.id}" aria-label="${a.n}"><img src="${avatarURL(a.id,PE.av===a.id?COL.p[0]:COL.dim,'frame-classic',56)}" alt=""></button>`).join(''); }
  $('pedit-av').addEventListener('click',e=>{ const b=e.target.closest('[data-av]'); if(!b) return; PE.av=b.dataset.av; sfx.tap(); renderAv(); });
  $('pedit-form').addEventListener('submit',e=>{ e.preventDefault(); const name=cleanName($('pedit-name').value);
    if(!name){ $('pedit-err').textContent='Give the profile a name.'; return; }
    if(DB.profiles.some(p=>p.name.toLowerCase()===name.toLowerCase()&&(!PE.pr||p.id!==PE.pr.id))){ $('pedit-err').textContent='That name is already taken. Pick another one.'; return; }
    let pr=PE.pr; if(pr){ pr.name=name; pr.av=PE.av; dbSave(); } else pr=createProfile(name,PE.av);
    refreshSeat(0); refreshSeat(1); const cb=PE.cb; close('pedit'); sfx.power(); if(cb) cb(pr); });

  /* profiles, skins, wheel */
  let LK={view:'list',id:null,spinning:false,rot:0};
  function openLocker(id){ LK={view:id?'prof':'list',id:id||null,spinning:false,rot:LK.rot||0}; renderLocker(); open('locker'); }
  function drawPreviews(root){ root.querySelectorAll('canvas[data-skin]').forEach(c=>{ const g=c.getContext('2d'); g.save(); g.scale(2,2); drawSkinPreview(g,c.dataset.skin,c.width/2,c.height/2,c.dataset.own==='1'?COL.p[0]:COL.edge,0.6); g.restore(); }); }
  function renderLocker(){ const b=$('locker-body');
    if(LK.view==='list'){ b.innerHTML=`<p class="inst-eyebrow">POINTS · SKINS · PRIZE WHEEL</p><h2>Profiles</h2>
      ${DB.profiles.length?'':'<p class="su-note">No profiles yet. Make one for everyone who plays: profiles collect points, and points spin the prize wheel for new skins.</p>'}
      <div class="pc-grid">${DB.profiles.map(pr=>`<button type="button" class="pc" data-act="prof" data-id="${pr.id}"><img src="${avatarURL(pr.av,COL.p[0],pr.eq.frame,72)}" alt=""><b>${prName(pr)}</b><span>${pr.pts} pts · ${ownedCount(pr)}/${SKINS.length} skins</span></button>`).join('')}
      <button type="button" class="pc new" data-act="new"><span class="plus">+</span><b>New profile</b><span>Name and avatar</span></button></div>
      <p class="su-note">Every game played earns 5 points, a win 10 more, a won match 25. Games against the bot earn half. Tournament champions get 100, runners-up 40.</p>`; return; }
    const pr=profById(LK.id); if(!pr){ LK.view='list'; renderLocker(); return; }
    if(LK.view==='prof'){ const spins=Math.floor(pr.pts/SPIN_COST);
      b.innerHTML=`<button type="button" class="back" data-act="list">‹ All profiles</button>
      <div class="ph"><img src="${avatarURL(pr.av,COL.p[0],pr.eq.frame,96)}" alt=""><div class="ph-t"><h2>${prName(pr)}</h2><p class="pts"><b>${pr.pts}</b> points · ${ownedCount(pr)}/${SKINS.length} skins</p></div><button type="button" class="btn-ghost" data-act="edit">Edit</button></div>
      <div class="spinrow"><button type="button" class="inst-primary" data-act="wheel" ${spins?'':'disabled'}>Spin the wheel · ${SPIN_COST} pts</button><span class="su-note">${spins?`${spins} spin${spins>1?'s':''} available`:`${SPIN_COST-pr.pts} more points to spin`}</span></div>
      ${SKIN_CATS.map(([c,label])=>`<section class="sk-sec"><h3>${label}</h3><div class="sk-grid">${SKINS.filter(s=>s.c===c).map(s=>{ const own=ownsSkin(pr,s.id), on=(pr.eq[c]||c+'-classic')===s.id;
        return `<button type="button" class="sk r${s.r}${own?'':' locked'}${on?' on':''}" data-act="${own?'equip':'locked'}" data-id="${s.id}" aria-pressed="${on}"><canvas width="176" height="112" data-skin="${s.id}" data-own="${own?1:0}"></canvas><b>${own?escH(s.n):'Locked'}</b><span>${on?'Equipped':RAR[s.r]}</span></button>`; }).join('')}</div></section>`).join('')}
      <div class="danger" id="lk-danger"><button type="button" class="btn-ghost warn" data-act="del">Delete profile</button></div>`;
      drawPreviews(b); return; }
    b.innerHTML=`<button type="button" class="back" data-act="prof" data-id="${pr.id}">‹ ${prName(pr)}</button><p class="inst-eyebrow">${SPIN_COST} POINTS PER SPIN</p><h2>Prize wheel</h2>
      <div class="wheel-wrap"><canvas id="wheel" width="640" height="640" aria-label="Prize wheel"></canvas><span class="wheel-pin" aria-hidden="true"></span></div>
      <p class="pts center"><b id="wh-pts">${pr.pts}</b> points</p><div class="center"><button type="button" class="inst-primary" data-act="spin" id="wh-spin" ${pr.pts<SPIN_COST?'disabled':''}>Spin · ${SPIN_COST} pts</button></div>
      <div id="wh-res" class="wh-res" role="status" aria-live="polite"></div>
      <ul class="legend"><li><i style="background:var(--common)"></i>Common skin</li><li><i style="background:var(--rare)"></i>Rare skin</li><li><i style="background:var(--pow)"></i>Legendary skin</li><li><i style="background:var(--edge)"></i>50 points back</li><li><i style="background:var(--line)"></i>Nothing</li></ul>`;
    drawWheel(LK.rot); }
  function drawWheel(rot){ const c=$('wheel'); if(!c) return; const g=c.getContext('2d'), S2=c.width, R=S2/2-14; g.clearRect(0,0,S2,S2); g.save(); g.translate(S2/2,S2/2);
    WHEEL.forEach((s,i)=>{ const [a0,a1]=WA[i]; g.beginPath(); g.moveTo(0,0); g.arc(0,0,R,a0+rot-Math.PI/2,a1+rot-Math.PI/2); g.closePath(); g.fillStyle=wheelCol(s.k); g.fill(); g.strokeStyle=COL.bg; g.lineWidth=6; g.stroke();
      g.save(); g.rotate((a0+a1)/2+rot-Math.PI/2); g.fillStyle=s.k==='N'||s.k==='F'?COL.ink:COL.bg; g.font='400 30px '+FD; g.textAlign='right'; g.textBaseline='middle'; g.fillText(WLAB[s.k],R-24,0); g.restore(); });
    g.beginPath(); g.arc(0,0,R,0,7); g.lineWidth=10; g.strokeStyle=COL.edge; g.stroke(); g.beginPath(); g.arc(0,0,46,0,7); g.fillStyle=COL.bg; g.fill(); g.lineWidth=6; g.strokeStyle=COL.pow; g.stroke();
    g.fillStyle=COL.pow; g.font='400 26px '+FD; g.textAlign='center'; g.textBaseline='middle'; g.fillText('SPIN',0,2); g.restore(); }
  const segAt=rot=>{ let a=((-rot)%(Math.PI*2)+Math.PI*2)%(Math.PI*2); return WA.findIndex(([a0,a1])=>a>=a0&&a<a1); };
  function spin(){ if(LK.spinning) return; const pr=profById(LK.id); if(!pr||pr.pts<SPIN_COST) return;
    pr.pts-=SPIN_COST; const idx=wheelPick(), prize=resolvePrize(pr,WHEEL[idx].k);
    if(prize.type==='skin') pr.owned.push(prize.skin.id); else if(prize.type==='pts') pr.pts+=prize.n; dbSaveNow();
    LK.spinning=true; $('wh-spin').disabled=true; $('wh-res').innerHTML=''; $('wh-pts').textContent=pr.pts-(prize.type==='pts'?prize.n:0);
    const [a0,a1]=WA[idx], c=(a0+a1)/2+(Math.random()-0.5)*(a1-a0)*0.7, r0=LK.rot; let tg=-c; while(tg<r0+Math.PI*10) tg+=Math.PI*2;
    const t0=performance.now(), dur=REDUCED?500:4300; let ls=segAt(r0);
    (function step(now){ const k=Math.min(1,(now-t0)/dur), r=r0+(tg-r0)*(1-Math.pow(1-k,4)); LK.rot=r; drawWheel(r); const si=segAt(r); if(si!==ls){ ls=si; sfx.tick(); }
      if(k<1) requestAnimationFrame(step); else { LK.rot=r%(Math.PI*2); LK.spinning=false; showPrize(prize,pr); } })(t0); }
  function showPrize(z,pr){ const el=$('wh-res'); if(!el) return; $('wh-pts').textContent=pr.pts; $('wh-spin').disabled=pr.pts<SPIN_COST;
    if(z.type==='skin'){ const s=z.skin, cat=SKIN_CATS.find(c=>c[0]===s.c)[1]; sfx.win();
      el.innerHTML=`<p class="won r${s.r}">${RAR[s.r]}!</p><div class="won-row"><canvas width="176" height="112" data-skin="${s.id}" data-own="1"></canvas><p>You won <b>${escH(s.n)}</b><br><small>${cat}</small></p></div>
        ${z.swap?`<p class="su-note">You already own every ${RAR[z.want].toLowerCase()} skin, so you got this one instead.</p>`:''}<button type="button" class="btn-ghost" data-act="equipwon" data-id="${s.id}">Equip now</button>`; drawPreviews(el); }
    else if(z.type==='pts'){ sfx.power(); el.innerHTML=z.all?'<p class="won">Collection complete</p><p>You own every skin, so your points come back.</p>':'<p class="won">+50 points</p><p>Half your spin back.</p>'; }
    else { sfx.point(); el.innerHTML='<p class="won dim">Nothing</p><p>Better luck on the next spin.</p>'; } }
  function equip(pr,id){ const s=skinById(id); if(!s||!ownsSkin(pr,id)) return; pr.eq[s.c]=id; dbSave(); refreshSeat(0); refreshSeat(1); }
  $('locker').addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b||b.disabled) return; const a=b.dataset.act, pr=profById(LK.id);
    if(LK.spinning&&a!=='spin') return;
    if(a==='list'){ LK.view='list'; } else if(a==='prof'){ LK.view='prof'; LK.id=b.dataset.id||LK.id; }
    else if(a==='new'){ editProfile(null,false,np=>{ LK.view='prof'; LK.id=np.id; renderLocker(); }); return; }
    else if(a==='edit'&&pr){ editProfile(pr,false,()=>renderLocker()); return; }
    else if(a==='wheel') LK.view='wheel';
    else if(a==='spin'){ spin(); return; }
    else if(a==='equip'&&pr) equip(pr,b.dataset.id);
    else if(a==='equipwon'&&pr){ equip(pr,b.dataset.id); b.textContent='Equipped'; b.disabled=true; sfx.tap(); return; }
    else if(a==='locked'){ showToast('Win this skin on the prize wheel.'); return; }
    else if(a==='del'){ $('lk-danger').innerHTML=`<p class="su-note">Delete ${prName(pr)}? Points and skins are gone for good.</p><button type="button" class="btn-ghost warn" data-act="delyes">Delete</button><button type="button" class="btn-ghost" data-act="delno">Keep</button>`; return; }
    else if(a==='delyes'&&pr){ deleteProfile(pr.id); refreshSeat(0); refreshSeat(1); LK.view='list'; }
    else if(a!=='delno') return;
    sfx.tap(); renderLocker(); const card=$('locker').querySelector('.inst-card'); if(card) card.scrollTop=0; });

  /* daily board */
  function openToday(){ renderToday(); open('today'); }
  function renderToday(){ const D=dayRoll(), rows=rankDay(D), date=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
    let h=`<p class="inst-eyebrow">${escH(date.toUpperCase())} · RESETS AT MIDNIGHT</p><h2>Today</h2>`;
    if(D.champ) h+=`<div class="champ"><img src="${avatarURL(D.champ.av,COL.pow,D.champ.frame,56)}" alt=""><span><small>Yesterday's champion</small><b>${escH(D.champ.name)}</b> with ${D.champ.g} win${D.champ.g===1?'':'s'}</span></div>`;
    if(!rows.length) h+=`<p class="su-note">No games yet today. Win games in a duel, online or in a tournament to get on the board. Games against the bot earn points but no wins.</p>`;
    else h+=`<div class="tbl"><table class="board"><thead><tr><th scope="col">#</th><th scope="col">Player</th><th scope="col">Wins</th><th scope="col">Matches</th><th scope="col">Points</th><th scope="col">Fastest draw</th><th scope="col">Longest run</th></tr></thead><tbody>${rows.map((r,i)=>{ const lead=i===0&&r.g>0; return `<tr${lead?' class="lead"':''}><td>${i+1}</td><td><span class="who"><img src="${avatarURL(r.av,lead?COL.pow:COL.p[0],r.frame,40)}" alt="">${escH(r.name)}</span></td><td>${r.g}</td><td>${r.m}</td><td>${r.pts}</td><td>${r.draw!=null?r.draw+' ms':'–'}</td><td>${r.run?r.run+' m':'–'}</td></tr>`; }).join('')}</tbody></table></div>
      <p class="su-note">Ranked by games won, then matches won. Games against the bot add points and personal bests, but no wins.</p>`;
    $('today-body').innerHTML=h; }

  /* sound */
  let tickT=0;
  function syncSound(){ $('snd-m').value=Math.round(VOL.m*100); $('snd-s').value=Math.round(VOL.s*100); $('snd-mv').textContent=Math.round(VOL.m*100)+'%'; $('snd-sv').textContent=Math.round(VOL.s*100)+'%'; }
  function openSound(){ syncSound(); open('sound'); }
  $('snd-m').addEventListener('input',e=>{ setVol('m',e.target.value/100); syncSound(); });
  $('snd-s').addEventListener('input',e=>{ setVol('s',e.target.value/100); syncSound(); const n=performance.now(); if(n-tickT>120){ tickT=n; sfx.tap(); } });

  /* tournament hub */
  const nameOf=id=>id==='BYE'?'BYE':id?escH(Tour.pname(id)):'—';
  const roundLabel=n=>n===1?'Final':n===2?'Semifinals':n===4?'Quarterfinals':'Round of '+n*2;
  function tableHTML(){ return `<div class="tbl"><table class="board"><thead><tr><th scope="col">#</th><th scope="col">Player</th><th scope="col">W</th><th scope="col">L</th><th scope="col">+/−</th></tr></thead><tbody>${Tour.table().map((r,i)=>`<tr${i===0&&r.w>0?' class="lead"':''}><td>${i+1}</td><td><span class="who"><img src="${avatarURL(Tour.pav(r.id),COL.p[0],Tour.pfr(r.id),40)}" alt="">${nameOf(r.id)}</span></td><td>${r.w}</td><td>${r.l}</td><td>${r.df>0?'+':''}${r.df}</td></tr>`).join('')}</tbody></table></div>`; }
  function resultsHTML(){ const done=DB.tour.fx.filter(f=>f.res&&!f.res.bye); if(!done.length) return '';
    return `<h3 class="sub">Results</h3><ul class="results">${done.slice().reverse().map(f=>{ const as=f.res.w===f.a?f.res.sw:f.res.sl, bs=f.res.w===f.b?f.res.sw:f.res.sl;
      return `<li><span class="${f.res.w===f.a?'w':''}">${nameOf(f.a)}</span><b>${as} – ${bs}</b><span class="${f.res.w===f.b?'w':''}">${nameOf(f.b)}</span><small>${f.tb?'TIEBREAK · ':''}${SHORT[f.g.k]}</small></li>`; }).join('')}</ul>`; }
  function bracketHTML(){ const t=DB.tour, R=Math.max(...t.fx.map(f=>f.r))+1; let h='<div class="bracket-wrap"><div class="bracket">';
    for(let r=0;r<R;r++){ const ms=t.fx.filter(f=>f.r===r); h+=`<div class="bcol"><p class="bcol-t">${roundLabel(ms.filter(f=>!f.third).length)}</p>${ms.map(f=>{ const sc=s=>!f.res||f.res.bye?'':(f.res.w===s?f.res.sw:f.res.sl);
      const line=(id)=>`<p class="${f.res&&f.res.w===id?'w':''}${id==='BYE'?' bye':''}"><span>${nameOf(id)}</span><b>${id&&id!=='BYE'?sc(id):''}</b></p>`;
      return `<div class="bm${f.third?' third':''}${!f.res&&f.a&&f.b?' live':''}">${f.third?'<small>Third place</small>':''}${line(f.a)}${line(f.b)}</div>`; }).join('')}</div>`; }
    return h+'</div></div>'; }
  function renderTour(){ const t=DB.tour, b=$('tour-body'); if(!t){ b.innerHTML=''; return; }
    if(t.done){ b.innerHTML=`<p class="inst-eyebrow">TOURNAMENT COMPLETE</p><div class="champ-big"><img src="${avatarURL(Tour.pav(t.champ),COL.pow,Tour.pfr(t.champ),140)}" alt=""><h2>${nameOf(t.champ)}</h2><p>Champion · +100 points</p></div>
        <ol class="podium"><li><b>1</b><span>${nameOf(t.champ)}</span></li>${t.second?`<li><b>2</b><span>${nameOf(t.second)}</span><small>+40 points</small></li>`:''}${t.thirdP?`<li><b>3</b><span>${nameOf(t.thirdP)}</span></li>`:''}</ol>
        ${t.fmt==='rr'?tableHTML():bracketHTML()}<div class="su-foot"><button type="button" class="inst-primary" data-act="tdone">Done</button></div>`; return; }
    const i=Tour.nextIdx(); if(i<0){ b.innerHTML='<p class="su-note">Waiting for results…</p>'; return; } const f=t.fx[i], g=f.g||t.lineup[t.played%t.lineup.length];
    const lab=f.tb?'TIEBREAK · FIRST PLACE IS TIED':f.third?'THIRD-PLACE MATCH':t.fmt==='ko'?roundLabel(t.fx.filter(x=>x.r===f.r&&!x.third).length).toUpperCase():'NEXT UP';
    b.innerHTML=`<p class="inst-eyebrow">${t.fmt==='rr'?'ROUND ROBIN':'KNOCKOUT'} · MATCH ${Tour.playedCount()+1} OF ${Tour.total()}</p><h2>Tournament</h2>
      <div class="next"><p class="next-l">${lab}</p><p class="next-g">${GDEF[g.k].name}<small>${escH(goalText(g))}</small></p>
        <div class="vs"><div class="side o"><img src="${avatarURL(Tour.pav(f.a),COL.p[0],Tour.pfr(f.a),72)}" alt=""><b>${nameOf(f.a)}</b><small>Orange · bottom half</small></div><span class="vs-t">VS</span><div class="side c"><img src="${avatarURL(Tour.pav(f.b),COL.p[1],Tour.pfr(f.b),72)}" alt=""><b>${nameOf(f.b)}</b><small>Cyan · top half</small></div></div>
        <button type="button" class="inst-primary" data-act="tplay">Play match</button></div>
      ${t.fmt==='rr'?`<h3 class="sub">Standings</h3>${tableHTML()}${resultsHTML()}`:`<h3 class="sub">Bracket</h3>${bracketHTML()}`}
      <div class="su-foot split"><button type="button" class="btn-ghost" data-act="thome">Back to home</button><span id="t-end"><button type="button" class="btn-ghost warn" data-act="tend">End tournament</button></span></div>`; }
  $('tour').addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act; audioInit(); sfx.tap();
    if(a==='tplay'){ close('tour'); Tour.play(); }
    else if(a==='thome') goHome();
    else if(a==='tend') $('t-end').innerHTML='<span class="su-note">End the tournament? Results so far are lost.</span><button type="button" class="btn-ghost warn" data-act="tendyes">End it</button><button type="button" class="btn-ghost" data-act="tendno">Keep playing</button>';
    else if(a==='tendyes'||a==='tdone'){ DB.tour=null; dbSaveNow(); goHome(); }
    else if(a==='tendno') renderTour(); });

  return {sync,editProfile,refreshHome};
})();

start();
})();
</script>
