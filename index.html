<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Split Duel">
<meta name="theme-color" content="#0b0c18">
<meta name="description" content="Five-game party duel for one screen: Pong, Tanks, Sumo Ring, Rooftop Run and Quick Draw. Play a friend, the bot, or online.">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Split Duel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: one full-bleed canvas, split across its long axis; each half faces its own player */
:root{
  --bg:#0b0c18;      /* arena ink, faint blue bias */
  --ink:#eef0ff;     /* primary text */
  --dim:#7c82ab;     /* secondary text */
  --line:#262a4d;    /* grid + midline */
  --block:#171a33;   /* tank obstacles */
  --edge:#3d4377;    /* obstacle edges */
  --p1:#ff7a3d;      /* ORANGE player */
  --p2:#2fd0ff;      /* CYAN player */
  --pow:#ffe14d;     /* power-up orbs */
  --storm:#e8336b;   /* closing storm in tank duel */
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);background:var(--bg)}
canvas{display:block;width:100%;height:100%;touch-action:none}

#inst,#net{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(5,6,14,.82);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  font-family:"Chakra Petch","Trebuchet MS",system-ui,sans-serif;color:var(--ink);-webkit-user-select:text;user-select:text;touch-action:auto}
#inst[hidden],#net[hidden]{display:none!important}
.inst-card{position:relative;width:min(680px,100%);max-height:100%;overflow:auto;background:var(--bg);border:2px solid var(--edge);border-radius:18px;padding:28px 28px 24px;box-shadow:0 0 0 1px var(--line),0 20px 60px rgba(0,0,0,.6)}
.inst-eyebrow{margin:0 0 6px;font-size:12px;letter-spacing:.14em;color:var(--dim)}
#inst h2,#net h2{margin:0 0 18px;font:400 clamp(24px,5vw,34px)/1.1 "Bungee","Arial Black",Impact,sans-serif;color:var(--ink);text-wrap:balance}
.inst-cols{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:start}
@media (max-width:560px){.inst-cols{grid-template-columns:1fr}.inst-qr{justify-self:center}}
.inst-steps{min-width:0;font-size:17px;line-height:1.45}
.inst-steps ol{margin:0;padding:0;list-style:none;display:grid;gap:14px;counter-reset:s}
.inst-steps li{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;counter-increment:s}
.inst-steps li::before{content:counter(s);display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--p1);color:var(--bg);font:400 16px "Bungee","Arial Black",sans-serif}
.inst-steps p{margin:0}
.inst-steps .note{margin-top:14px;font-size:14px;color:var(--dim)}
.inst-steps b{color:var(--ink)}
.inst-ico{display:inline-block;width:22px;height:22px;vertical-align:-5px;margin:0 2px;color:var(--p2)}
.inst-primary{display:inline-flex;align-items:center;gap:10px;margin:4px 0 10px;padding:14px 22px;border:0;border-radius:12px;background:var(--p1);color:var(--bg);font:400 18px "Bungee","Arial Black",sans-serif;cursor:pointer;box-shadow:0 0 24px rgba(255,122,61,.45)}
.inst-primary:focus-visible,.inst-x:focus-visible{outline:3px solid var(--pow);outline-offset:3px}
.inst-x{position:absolute;top:10px;right:12px;width:40px;height:40px;border:0;border-radius:50%;background:transparent;color:var(--dim);font-size:30px;line-height:1;cursor:pointer}
.inst-qr{margin:0;display:grid;gap:10px;justify-items:center;width:220px;max-width:100%}
.inst-qr canvas{width:220px;max-width:100%;height:auto;aspect-ratio:1;border-radius:12px;background:#fff}
.inst-qr figcaption{font-size:13px;line-height:1.35;color:var(--dim);text-align:center}
.inst-arrow{position:fixed;width:54px;height:54px;color:var(--pow);filter:drop-shadow(0 0 10px rgba(255,225,77,.6));pointer-events:none}
.inst-arrow svg{width:100%;height:100%}
.inst-arrow.up{top:calc(env(safe-area-inset-top,0px) + 6px);right:calc(env(safe-area-inset-right,0px) + 92px);animation:instUp 1s ease-in-out infinite}
.inst-arrow.down{bottom:calc(env(safe-area-inset-bottom,0px) + 8px);left:50%;margin-left:-27px;animation:instDown 1s ease-in-out infinite}
  .inst-arrow.down svg{transform:rotate(180deg)}
.net-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:560px){.net-grid{grid-template-columns:1fr}}
.net-grid section{min-width:0;display:grid;gap:12px;align-content:start;padding:18px;border:1.5px solid var(--line);border-radius:14px}
.net-grid h3{margin:0;font:400 18px "Bungee","Arial Black",sans-serif;color:var(--ink)}
.net-grid p{margin:0;color:var(--dim);font-size:15px;line-height:1.4}
#net-join{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#net-join .inst-primary{margin:0}
#net-code{flex:1 1 120px;min-width:0;padding:11px 14px;border-radius:12px;border:2px solid var(--edge);background:var(--block);color:var(--ink);font:400 24px "Bungee","Arial Black",sans-serif;letter-spacing:.25em;text-transform:uppercase}
#net-code:focus-visible{outline:3px solid var(--pow);outline-offset:2px}
.net-label{margin:0;font-size:12px;letter-spacing:.14em;color:var(--dim)}
.net-code{margin:0 0 6px;font:400 clamp(44px,12vw,64px)/1 "Bungee","Arial Black",sans-serif;letter-spacing:.12em;color:var(--pow)}
.net-link{margin:6px 0 0;font-size:13px;color:var(--dim);word-break:break-all;-webkit-user-select:all;user-select:all}
.net-status{margin:16px 0 0;font-size:15px;line-height:1.4;color:var(--dim);min-height:1.4em}
.net-status.err{color:var(--storm)}
.net-status.wait::after{content:"";display:inline-block;width:8px;height:8px;margin-left:10px;border-radius:50%;background:var(--pow);vertical-align:1px;animation:netPulse 1s ease-in-out infinite}
@keyframes netPulse{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){.net-status.wait::after{animation:none}}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);z-index:30;width:max-content;max-width:calc(100% - 32px);padding:12px 18px;background:var(--bg);color:var(--ink);border:2px solid var(--edge);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.5);font:500 16px/1.35 "Chakra Petch","Trebuchet MS",sans-serif;text-align:center}
.toast[hidden]{display:none!important}
@keyframes instUp{50%{transform:translateY(-10px)}}
@keyframes instDown{50%{transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){.inst-arrow{animation:none!important}}
</style>
</head>
<body>
<div id="stage"><canvas id="c" aria-label="Split Duel: two-player game arena"></canvas></div>
<div id="inst" hidden role="dialog" aria-modal="true" aria-labelledby="inst-t">
  <div class="inst-card">
    <button type="button" id="inst-x" class="inst-x" aria-label="Close">×</button>
    <p class="inst-eyebrow" id="inst-eye">PLAY OFFLINE · NO STORE NEEDED</p>
    <h2 id="inst-t">Install Split Duel</h2>
    <div class="inst-cols">
      <div class="inst-steps" id="inst-steps"></div>
      <figure class="inst-qr" id="inst-qrbox">
        <canvas id="inst-qr" width="220" height="220" aria-label="QR code linking to Split Duel"></canvas>
        <figcaption id="inst-cap">Friends scan this to install it on their phone or tablet</figcaption>
      </figure>
    </div>
  </div>
  <div class="inst-arrow" id="inst-arrow" hidden aria-hidden="true"></div>
</div>
<div id="net" hidden role="dialog" aria-modal="true" aria-labelledby="net-t">
  <div class="inst-card">
    <button type="button" id="net-x" class="inst-x" aria-label="Close">×</button>
    <p class="inst-eyebrow">ONLINE · TWO DEVICES · ONE DUEL</p>
    <h2 id="net-t">Play online</h2>
    <div id="net-body"></div>
    <p id="net-status" class="net-status" role="status" aria-live="polite"></p>
  </div>
</div>
<div id="toast" class="toast" hidden role="status" aria-live="polite"></div>


<script>
(() => {
const cs = getComputedStyle(document.documentElement);
const tok = n => cs.getPropertyValue(n).trim();
const COL = { bg:tok('--bg'), ink:tok('--ink'), dim:tok('--dim'), line:tok('--line'), block:tok('--block'), edge:tok('--edge'), pow:tok('--pow'), storm:tok('--storm'), p:[tok('--p1'), tok('--p2')] };
const NAMES = ['ORANGE','CYAN'];
const FD = '"Bungee", "Arial Black", Impact, sans-serif';
const FT = '"Chakra Petch", "Trebuchet MS", system-ui, sans-serif';
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const LABEL = {BIG:'BIG PADDLE',SHRINK:'SHRINK RAY',SHIELD:'GOAL SHIELD',SMASH:'POWER SMASH',RAPID:'RAPID FIRE',TRIPLE:'TRIPLE SHOT',SPEED:'NITRO',ARMOR:'ARMOR',DOUBLE:'DOUBLE JUMP',DROP:'ROADBLOCK',HOMING:'HOMING SHOTS',REPAIR:'HULL REPAIR',HEAVY:'HEAVYWEIGHT',SHOCK:'SHOCKWAVE'};

const cvs = document.getElementById('c'), ctx = cvs.getContext('2d');
let W=0,H=0,S=0,L=0,land=false,DPR=1,U=1,SS=0,SL=0,FK=1,FX=0,FY=0;
var NET=null;
function guestView(){ return !!(NET&&NET.on&&NET.role==='guest'); }

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const angDiff=(a,b)=>{let d=b-a;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d;};

/* ---------- coordinates ----------
   Logical frame: width W = short side, height H = long side.
   Player 0 (ORANGE) owns the bottom half, player 1 (CYAN) the top half.
   In landscape the frame is rotated so ORANGE sits on the right. */
function resize(){
  const r=cvs.getBoundingClientRect();
  DPR=Math.min(window.devicePixelRatio||1,2);
  cvs.width=Math.round(r.width*DPR); cvs.height=Math.round(r.height*DPR);
  land=r.width>r.height; SS=Math.min(r.width,r.height); SL=Math.max(r.width,r.height);
  const vd=guestView()&&NET.dims?NET.dims:null; W=vd?vd.W:SS; H=vd?vd.H:SL; S=W; L=H; U=Math.min(W,H/2)/100;
  FK=Math.min(SS/W,SL/H); FX=(SS-W*FK)/2; FY=(SL-H*FK)/2;
  if(game&&!game.net&&!guestView()) game=game.rebuild();
  if(NET&&NET.on&&NET.role==='host') netSend({t:'dims',W,H});
}
function baseTransform(){ if(land) ctx.setTransform(0,-DPR,DPR,0,0,SS*DPR); else ctx.setTransform(DPR,0,0,DPR,0,0);
  if(guestView()){ ctx.translate(FX,FY); ctx.scale(FK,FK); ctx.translate(W,H); ctx.rotate(Math.PI); } }
function toLogical(e){ const r=cvs.getBoundingClientRect(), px=e.clientX-r.left, py=e.clientY-r.top; let x=land?SS-py:px, y=land?px:py;
  if(guestView()){ x=W-(x-FX)/FK; y=H-(y-FY)/FK; } return {x,y}; }
function view(p,fn){ ctx.save(); if(p===0) ctx.translate(W/2,H*0.75); else {ctx.translate(W/2,H*0.25); ctx.rotate(Math.PI);} fn(); ctx.restore(); }
function toView(p,x,y){ return p===0?{x:x-W/2,y:y-H*0.75}:{x:W/2-x,y:H*0.25-y}; }
function local(p,x,y){ return p===0?{u:x,v:H-y}:{u:W-x,v:y}; }
function fromLocal(p,u,v){ return p===0?{x:u,y:H-v}:{x:W-u,y:v}; }
function at(p,x,y,fn){ ctx.save(); ctx.translate(x,y); if(p===1) ctx.rotate(Math.PI); fn(); ctx.restore(); }

/* ---------- drawing helpers ---------- */
function rr(x,y,w,h,r){ ctx.beginPath(); if(!(w>0&&h>0)) return; r=Math.max(0,Math.min(r,w/2,h/2)); ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function txt(s,x,y,size,font,color,align='center',alpha=1){ ctx.save(); ctx.globalAlpha*=alpha; ctx.font=size+'px '+font; ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline='middle'; ctx.fillText(s,x,y); ctx.restore(); }
function wrap(s,maxW,size,font){ ctx.font=size+'px '+font; const words=s.split(' '); const out=[]; let cur=''; for(const w of words){ const t=cur?cur+' '+w:w; if(ctx.measureText(t).width>maxW&&cur){out.push(cur);cur=w;} else cur=t; } if(cur) out.push(cur); return out; }
let hits=[];
function button(p,id,cx,cy,w,h,label,color,filled,size){
  ctx.save(); rr(cx-w/2,cy-h/2,w,h,h*0.22);
  if(filled){ ctx.fillStyle=color; ctx.shadowColor=color; ctx.shadowBlur=U*4; ctx.fill(); ctx.shadowBlur=0; }
  ctx.lineWidth=Math.max(2,U*0.55); ctx.strokeStyle=color; ctx.stroke(); ctx.restore();
  txt(label,cx,cy+U*0.3,size||U*4.2,FD,filled?COL.bg:color);
  hits.push({p,id,x:cx-w/2,y:cy-h/2,w,h});
}
function arrow(x1,x2,y,s){ ctx.beginPath(); ctx.moveTo(x1,y); ctx.lineTo(x2,y); const d=Math.sign(x2-x1); ctx.moveTo(x2-d*s,y-s); ctx.lineTo(x2,y); ctx.lineTo(x2-d*s,y+s); ctx.stroke(); }
function drawIcon(k,x,y,s,col){
  ctx.save(); ctx.translate(x,y); ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=Math.max(1.5,s*0.15); ctx.lineCap='round'; ctx.lineJoin='round'; const a=s*0.5;
  switch(k){
    case 'BIG': arrow(-a*0.1,-a,0,a*0.35); arrow(a*0.1,a,0,a*0.35); break;
    case 'SHRINK': arrow(-a,-a*0.15,0,a*0.35); arrow(a,a*0.15,0,a*0.35); break;
    case 'SHIELD': case 'ARMOR': ctx.beginPath(); ctx.moveTo(0,-a); ctx.lineTo(a*0.8,-a*0.6); ctx.lineTo(a*0.72,a*0.15); ctx.quadraticCurveTo(a*0.45,a*0.7,0,a); ctx.quadraticCurveTo(-a*0.45,a*0.7,-a*0.72,a*0.15); ctx.lineTo(-a*0.8,-a*0.6); ctx.closePath(); ctx.stroke(); break;
    case 'SMASH': ctx.beginPath(); [[a*0.25,-a],[-a*0.5,a*0.12],[-a*0.02,a*0.12],[-a*0.25,a],[a*0.5,-a*0.12],[a*0.02,-a*0.12]].forEach(([px,py],i)=>i?ctx.lineTo(px,py):ctx.moveTo(px,py)); ctx.closePath(); ctx.fill(); break;
    case 'RAPID': for(let i=-1;i<=1;i++){ rr(-a*0.8,i*a*0.55-a*0.15,a*1.6,a*0.3,a*0.15); ctx.fill(); } break;
    case 'TRIPLE': ctx.beginPath(); [-0.7,0,0.7].forEach(dx=>{ ctx.moveTo(0,a*0.8); ctx.lineTo(dx*a,-a*0.8); }); ctx.stroke(); break;
    case 'SPEED': ctx.beginPath(); [-0.45,0.25].forEach(o=>{ ctx.moveTo((o-0.3)*a,-a*0.7); ctx.lineTo((o+0.3)*a,0); ctx.lineTo((o-0.3)*a,a*0.7); }); ctx.stroke(); break;
    case 'HEAVY': ctx.beginPath(); ctx.moveTo(-a*0.45,-a*0.05); ctx.lineTo(a*0.45,-a*0.05); ctx.lineTo(a*0.75,a*0.85); ctx.lineTo(-a*0.75,a*0.85); ctx.closePath(); ctx.fill(); ctx.beginPath(); ctx.arc(0,-a*0.3,a*0.38,Math.PI,0); ctx.stroke(); break;
    case 'SHOCK': ctx.beginPath(); ctx.arc(0,0,a*0.25,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(0,0,a*0.6,0,7); ctx.stroke(); ctx.globalAlpha=0.6; ctx.beginPath(); ctx.arc(0,0,a*0.95,0,7); ctx.stroke(); break;
    case 'HOMING': ctx.beginPath(); ctx.arc(0,0,a*0.55,0,7); ctx.moveTo(0,-a); ctx.lineTo(0,-a*0.3); ctx.moveTo(0,a); ctx.lineTo(0,a*0.3); ctx.moveTo(-a,0); ctx.lineTo(-a*0.3,0); ctx.moveTo(a,0); ctx.lineTo(a*0.3,0); ctx.stroke(); break;
    case 'REPAIR': ctx.fillRect(-a*0.22,-a*0.75,a*0.44,a*1.5); ctx.fillRect(-a*0.75,-a*0.22,a*1.5,a*0.44); break;
    case 'DOUBLE': ctx.beginPath(); [-0.45,0.25].forEach(o=>{ ctx.moveTo(-a*0.6,(o+0.35)*a); ctx.lineTo(0,(o-0.25)*a); ctx.lineTo(a*0.6,(o+0.35)*a); }); ctx.stroke(); break;
    case 'DROP': ctx.fillRect(-a*0.55,a*0.2,a*1.1,a*0.75); ctx.beginPath(); ctx.moveTo(0,-a); ctx.lineTo(0,-a*0.05); ctx.moveTo(-a*0.35,-a*0.4); ctx.lineTo(0,-a*0.05); ctx.lineTo(a*0.35,-a*0.4); ctx.stroke(); break;
    case 'GHOST': ctx.beginPath(); ctx.arc(0,-a*0.15,a*0.7,Math.PI,0); ctx.lineTo(a*0.7,a*0.85); ctx.lineTo(a*0.35,a*0.55); ctx.lineTo(0,a*0.85); ctx.lineTo(-a*0.35,a*0.55); ctx.lineTo(-a*0.7,a*0.85); ctx.closePath(); ctx.fill();
      ctx.fillStyle=COL.bg; ctx.beginPath(); ctx.arc(-a*0.27,-a*0.2,a*0.14,0,7); ctx.arc(a*0.27,-a*0.2,a*0.14,0,7); ctx.fill(); break;
    case 'BLAST': ctx.beginPath(); for(let i=0;i<8;i++){ const t=i*Math.PI/4; ctx.moveTo(Math.cos(t)*a*0.3,Math.sin(t)*a*0.3); ctx.lineTo(Math.cos(t)*a,Math.sin(t)*a); } ctx.stroke(); break;
  }
  ctx.restore();
}
function drawOrb(x,y,r,k,t){ const s=1+Math.sin(t*6)*0.08; ctx.save(); ctx.shadowColor=COL.pow; ctx.shadowBlur=U*4; ctx.fillStyle=COL.bg; ctx.strokeStyle=COL.pow; ctx.lineWidth=Math.max(2,r*0.14);
  ctx.beginPath(); ctx.arc(x,y,r*s,0,7); ctx.fill(); ctx.stroke(); ctx.restore(); drawIcon(k,x,y,r*1.05,COL.pow); }

/* ---------- particles, shake, pop-up labels ---------- */
let parts=[], shakeT=0, pops=[];
function burst(x,y,col,n,spd){ if(NET&&NET.fx&&!(game&&game.net)) NET.fx.push(['b',x,y,col,n,spd]); for(let i=0;i<n;i++){ const a=Math.random()*Math.PI*2, v=rnd(0.2,1)*spd; parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(0.35,0.9),max:0.9,col,sz:rnd(0.5,1.3)*U}); } }
function shake(t){ if(NET&&NET.fx&&!(game&&game.net)) NET.fx.push(['k',t]); if(!REDUCED) shakeT=Math.max(shakeT,t); }
function pop(p,text,col){ if(NET&&NET.fx&&!(game&&game.net)) NET.fx.push(['p',p,text,col]); pops=pops.filter(q=>q.p!==p); pops.push({p,text,col:col||COL.pow,t:1.6}); }
function updParts(dt){ for(const q of parts){ q.x+=q.vx*dt; q.y+=q.vy*dt; q.vx*=0.94; q.vy*=0.94; q.life-=dt; } parts=parts.filter(q=>q.life>0); for(const q of pops) q.t-=dt; pops=pops.filter(q=>q.t>0); }
function drawParts(){ ctx.save(); ctx.globalCompositeOperation='lighter'; for(const q of parts){ ctx.globalAlpha=clamp(q.life/q.max,0,1); ctx.fillStyle=q.col; ctx.fillRect(q.x-q.sz/2,q.y-q.sz/2,q.sz,q.sz); } ctx.restore(); }
function drawPops(p){ for(const q of pops) if(q.p===p){ const k=Math.min(1,q.t/0.4), rise=(1.6-q.t)*U*3; txt(q.text,0,-U*20-rise,U*4.6,FD,q.col,'center',k); } }

/* ---------- sound effects ---------- */
let AC=null;
function audioInit(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume().catch(()=>{}); Music.ensure(); }
function tone(f,d,type='square',vol=0.04,slide=0){ if(!AC) return; const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.setValueAtTime(f,t); if(slide) o.frequency.linearRampToValueAtTime(Math.max(40,f+slide),t+d); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+d+0.02); }

Pong.prototype.predict=function(dt){ const b=this.b; if(this.hold<=0&&b.x>-900){ b.x+=b.vx*dt; b.y+=b.vy*dt; if(b.x<this.r){ b.x=this.r; b.vx=Math.abs(b.vx); } if(b.x>W-this.r){ b.x=W-this.r; b.vx=-Math.abs(b.vx); } }
  if(NET.localX!=null){ const w=this.wc[1]; this.px[1]=clamp(NET.localX,w/2,W-w/2); } };
Tank.prototype.predict=function(dt){ this.clock+=dt; for(const bl of this.bul){ bl.x+=bl.vx*dt; bl.y+=bl.vy*dt; } };
Sumo.prototype.predict=function(dt){ this.clock+=dt; for(const b of this.p) if(b.alive){ b.x+=b.vx*dt; b.y+=b.vy*dt; } };
Draw.prototype.predict=function(dt){ this.clock+=dt; this.flash=Math.max(0,this.flash-dt*2.5); };

/* Rooftop Run online: same seeded course on both devices, crash distances decide the round */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
Runner.prototype.netInit=function(lp,seed){ this.net={lp,host:lp===0}; this.netSeed=seed; this.reset(seed); };
Runner.prototype.netRemote=function(m){ const r=this.r[1-this.net.lp]; r.h=m.h; r.alive=m.al; this.rD=m.d; };
Runner.prototype.netDrop=function(){ this.dropOn(this.net.lp,1-this.net.lp); };
Runner.prototype.netArbitrate=function(){ const c0=this.cr[0], c1=this.cr[1]; if(c0==null&&c1==null) return;
  if(this.firstT==null) this.firstT=this.clock; let res=null;
  if(c0!=null&&c1!=null) res=Math.abs(c0-c1)<U*2?-1:(c0>c1?0:1);
  else if(c0!=null&&this.rD>c0+U*4) res=1;
  else if(c1!=null&&this.d>c1+U*4) res=0;
  else if(this.clock-this.firstT>1.2) res=c0!=null?1:0;
  if(res===null) return;
  const sc=this.score.slice(); if(res>=0) sc[res]++; const m={t:'rr',res,score:sc,seed:(Math.random()*2147483647)|0,end:res>=0&&sc[res]>=this.target};
  netSend(m); this.netRound(m); };
Runner.prototype.netRound=function(m){ if(this.netDone) return; this.netDone=true; this.score=m.score.slice(); this.nextSeed=m.seed; const lp=this.net.lp;
  this.msg=m.res<0?'DRAW · NO POINT':m.res===lp?'YOU OUTRAN '+NAMES[1-lp]:NAMES[m.res]+' WINS THE ROUND';
  if(m.res>=0) this.r[1-m.res].alive=false;
  if(m.end){ if(this.net.host){ this.winner=m.res; this.endT=1.6; } else this.pause=99; } else this.pause=1.8; };

  button(p,'skip',0,U*10,U*46,U*9,match.gi>=GAMES.length-1?'SKIP TO RESULTS':'SKIP THIS GAME',COL.ink,false,U*3.4); button(p,'quit',0,U*22,U*46,U*8,NET&&NET.on?'BACK TO LOBBY':'MAIN MENU',COL.dim,false,U*3.4); }

function render(){
  hits=[]; ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle=COL.bg; ctx.fillRect(0,0,cvs.width,cvs.height); baseTransform();
  if(shakeT>0) ctx.translate(rnd(-1,1)*U*1.2*shakeT*4,rnd(-1,1)*U*1.2*shakeT*4);
  backdrop();
  const inGame=game&&(scene==='play'||scene==='countdown'||scene==='gameEnd');
  if(inGame){ game.draw(); if(scene!=='gameEnd') for(let p=0;p<2;p++) if(p!==remoteP()&&game.hint) game.hint(p); }
  drawParts();
  if(paused){ ctx.save(); ctx.globalAlpha=0.82; ctx.fillStyle=COL.bg; ctx.fillRect(0,0,W,H); ctx.restore(); for(let p=0;p<2;p++) view(p,()=>{ if(p===remoteP()) txt('PAUSED',0,-U*4,U*7,FD,COL.dim); else drawPause(p); }); drawMusicBtn(); return; }
  for(let p=0;p<2;p++) view(p,()=>{
    if(NET&&NET.on&&p===remoteP()&&menuScene()){ const lw=leader();
      if(scene==='title') drawRemoteCard('IN YOUR LOBBY','CODE '+NET.code);
      else if(scene==='intro') drawRemoteCard('NEXT UP: '+GAMES[match.gi].name,'MATCH '+match.wins[p]+' – '+match.wins[1-p]);
      else drawRemoteCard(lw===p?NAMES[p]+' TAKES THE DUEL':lw<0?'A DRAW THIS TIME':'YOU TAKE THE DUEL','READY FOR A REMATCH?'); }
    else if(solo&&p===1&&(scene==='title'||scene==='intro'||scene==='final')){ const lw=leader();
      if(scene==='title') drawBotCard('READY WHEN YOU ARE','PICK THE DIFFICULTY ON YOUR SIDE');
      else if(scene==='intro') drawBotCard('NEXT UP: '+GAMES[match.gi].name,'MATCH '+match.wins[1]+' – '+match.wins[0]);
      else drawBotCard(lw===1?'THE BOT TAKES THE DUEL':lw===0?'YOU BEAT THE BOT':'A DRAW WITH THE BOT','REMATCH ON YOUR SIDE'); }
    else if(scene==='title') drawTitle(p); else if(scene==='intro') drawIntro(p); else if(scene==='final') drawFinal(p);
    else if(scene==='countdown') drawCount(p); else if(scene==='play') drawHud(p); else if(scene==='gameEnd') drawGameEnd(p); });
  if(scene==='play'||scene==='countdown') drawPauseBtn(); else if(menuScene()&&canInstall()) drawInstallBtn();
  drawMusicBtn();
}

/* ---------- input ---------- */
const ptrs=new Map();
cvs.addEventListener('pointerdown',e=>{ e.preventDefault(); audioInit(); wake(); try{cvs.setPointerCapture(e.pointerId);}catch(_){}
  const {x,y}=toLogical(e);
  const m=MB(); if(Math.hypot(x-m.x,y-m.y)<m.r*1.5){ Music.toggle(); sfx.tap(); return; }
  if(menuScene()&&canInstall()&&!paused){ const b=PB(); if(Math.hypot(x-b.x,y-b.y)<b.r*1.5){ sfx.tap(); window.SDInstall.open(); return; } }
  if((scene==='play'||scene==='countdown')&&!paused){ const b=PB(); if(Math.hypot(x-b.x,y-b.y)<b.r*1.5){ paused=true; if(guestView()) netSend({t:'a',a:'pause'}); sfx.tap(); return; } }
  const rp=remoteP(), owner=(rp>=0&&scene==='play'&&!paused)?LP():(y>H/2?0:1);
  if(NET&&NET.on&&owner===rp) return;
  ptrs.set(e.pointerId,owner);
  const v=toView(owner,x,y); const hit=hits.find(h=>h.p===owner&&v.x>=h.x&&v.x<=h.x+h.w&&v.y>=h.y&&v.y<=h.y+h.h);
  const gv=guestView();
  if(paused){ if(!hit) return; sfx.tap();
    if(hit.id==='resume'){ paused=false; if(gv) netSend({t:'a',a:'resume'}); } else if(hit.id==='skip'){ if(gv) netSend({t:'a',a:'skip'}); else skipGame(); } else if(hit.id==='quit'){ if(gv) netSend({t:'a',a:'menu'}); else toTitle(); } return; }
  if(hit&&hit.id==='ready'){ ready[owner]=!ready[owner]; if(gv) netSend({t:'a',a:'ready'}); sfx.tap(); return; }
  if(hit&&hit.id==='menu'){ sfx.tap(); if(gv) netSend({t:'a',a:'menu'}); else toTitle(); return; }
  if(hit&&hit.id==='leave'){ sfx.tap(); netLeave('You left the lobby.'); return; }
  if(hit&&hit.id==='net'){ sfx.tap(); NetUI.open(); return; }
  if(hit&&hit.id==='m1'){ solo=true; saveMode(); sfx.tap(); return; }
  if(hit&&hit.id==='m2'){ if(solo){ solo=false; ready[1]=false; } saveMode(); sfx.tap(); return; }
  if(hit&&/^lv\d$/.test(hit.id)){ level=+hit.id[2]; saveMode(); sfx.tap(); return; }
  if(scene==='play'&&game){ if(gv&&!game.net){ if(game._k==='draw'){ if(game.state!=='done') netSend({t:'dr',rt:game.state==='go'?(performance.now()-NET.goAt)/1000:-1}); }
      else { netSend({t:'i',k:'d',id:e.pointerId,x,y}); if(game._k==='pong') NET.localX=x; } }
    else game.down(owner,e.pointerId,x,y); }
},{passive:false});
cvs.addEventListener('pointermove',e=>{ if(!ptrs.has(e.pointerId)||paused||scene!=='play'||!game) return; e.preventDefault(); const {x,y}=toLogical(e);
  if(guestView()&&!game.net){ if(game._k!=='draw'){ netSend({t:'i',k:'m',id:e.pointerId,x,y}); if(game._k==='pong') NET.localX=x; } } else game.move(ptrs.get(e.pointerId),e.pointerId,x,y); },{passive:false});
function release(e){ if(!ptrs.has(e.pointerId)) return; const o=ptrs.get(e.pointerId); ptrs.delete(e.pointerId); if(!game) return;
  if(guestView()&&!game.net){ if(game._k!=='draw') netSend({t:'i',k:'u',id:e.pointerId}); } else game.up(o,e.pointerId); }
cvs.addEventListener('pointerup',release); cvs.addEventListener('pointercancel',release);
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&(scene==='play'||scene==='countdown')){ paused=true; if(guestView()) netSend({t:'a',a:'pause'}); } });

/* ---------- boot ---------- */
function start(data){
  if(data&&data.match&&data.match.history&&data.match.history.length<GAMES.length&&data.match.gi===data.match.history.length){ match=data.match; toIntro(); }
  resize(); window.addEventListener('resize',resize);
  let last=performance.now();
  (function frame(now){ requestAnimationFrame(frame); const dt=Math.min(0.05,(now-last)/1000); last=now; try{ update(dt); render(); }catch(e){ console.error(e); } })(last);
}
try{ window.claude?.hot?.snapshot?.(()=>({match})); }catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
<script src="qrcode.min.js"></script><script src="peerjs.min.js"></script>
<script>
/* Install helper: one-tap install on Android, a guided Add to Home Screen on iPhone and iPad, and a QR code for friends */
(()=>{
  const $=id=>document.getElementById(id);
  const box=$('inst'), steps=$('inst-steps'), arrow=$('inst-arrow');
  const ua=navigator.userAgent, isIOS=/iPad|iPhone|iPod/.test(ua)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1), isPhone=/iPhone|iPod/.test(ua);
  const isAndroid=/Android/i.test(ua), inApp=/FBAN|FBAV|Instagram|Line\/|WhatsApp|Snapchat|Telegram/i.test(ua);
  const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  const inFrame=(()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
  let deferred=null;
  addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferred=e; if(!box.hidden) render(); });
  addEventListener('appinstalled',()=>{ deferred=null; if(!box.hidden) render('done'); });
  const SHARE='<svg class="inst-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7.5 7.5 12 3l4.5 4.5"/><path d="M7 11H5.5A1.5 1.5 0 0 0 4 12.5v7A1.5 1.5 0 0 0 5.5 21h13a1.5 1.5 0 0 0 1.5-1.5v-7a1.5 1.5 0 0 0-1.5-1.5H17"/></svg>';
  const PLUS='<svg class="inst-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></svg>';
  const ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V4"/><path d="M5 11l7-7 7 7"/></svg>';
  function url(){ return location.origin+location.pathname+'#install'; }
  function drawQR(){ const c=$('inst-qr'), g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height);
    if(typeof qrcode!=='function'){ $('inst-qrbox').hidden=true; return; }
    const q=qrcode(0,'M'); q.addData(url()); q.make(); const n=q.getModuleCount(), quiet=3, s=Math.floor(c.width/(n+quiet*2)), off=Math.floor((c.width-s*n)/2);
    g.fillStyle='#0b0c18'; for(let y=0;y<n;y++) for(let x=0;x<n;x++) if(q.isDark(y,x)) g.fillRect(off+x*s,off+y*s,s,s); }
  function render(state){
    arrow.hidden=true; arrow.className='inst-arrow'; let html='', title='Install Split Duel', eye='PLAY OFFLINE · NO STORE NEEDED';
    if(state==='done'){ title='Installed!'; html='<p>Split Duel is on your home screen now. Open it from there for full-screen play.</p>'; }
    else if(standalone()){ title='Share Split Duel'; eye='INVITE A FRIEND'; html='<p>Split Duel is already installed on this device.</p><p class="note">Let a friend scan the code with their phone or tablet camera. Their screen then shows them exactly how to install it.</p>'; }
    else if(isIOS&&inApp){ html='<ol><li><p>This page is open inside another app. Tap <b>•••</b> or the compass icon and choose <b>Open in Safari</b>.</p></li><li><p>Then follow the install steps that appear there.</p></li></ol>'; }
    else if(isIOS){ html=`<ol><li><p>Tap the <b>Share</b> button ${SHARE} ${isPhone?'in the bar at the bottom. On newer iPhones it sits inside the <b>•••</b> menu.':'at the top right of Safari.'}</p></li>
      <li><p>Scroll and choose <b>Add to Home Screen</b> ${PLUS}</p></li><li><p>Tap <b>Add</b>. Split Duel now opens full screen from its own icon, even offline.</p></li></ol>`;
      arrow.innerHTML=ARROW; arrow.classList.add(isPhone?'down':'up'); arrow.hidden=false; }
    else if(deferred){ html='<button type="button" class="inst-primary" id="inst-go">Install app</button><p>One tap and Split Duel sits on your home screen, full screen and playable offline.</p>'; }
    else if(isAndroid){ html='<ol><li><p>Open the browser menu <b>⋮</b> at the top right.</p></li><li><p>Choose <b>Install app</b> or <b>Add to Home screen</b>.</p></li></ol>'; }
    else { title='Play on a phone or tablet'; eye='SCAN TO INSTALL'; html='<p>Scan the code with the camera of a phone or tablet. The page then shows how to install Split Duel there.</p>'; }
    $('inst-t').textContent=title; $('inst-eye').textContent=eye; steps.innerHTML=html; drawQR();
    const go=$('inst-go'); if(go) go.addEventListener('click',async()=>{ const d=deferred; if(!d) return; deferred=null; d.prompt(); try{ const r=await d.userChoice; render(r.outcome==='accepted'?'done':undefined); }catch(e){ render(); } }); }
  function open(){ render(); box.hidden=false; const x=$('inst-x'); try{ x.focus({preventScroll:true}); }catch(e){} }
  function close(){ box.hidden=true; arrow.hidden=true; if(location.hash==='#install') try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
  $('inst-x').addEventListener('click',close);
  box.addEventListener('click',e=>{ if(e.target===box) close(); });
  addEventListener('keydown',e=>{ if(e.key==='Escape'&&!box.hidden) close(); });
  window.SDInstall={ available:!inFrame, installed:standalone, open };
  if(!inFrame&&location.hash==='#install'&&!standalone()) addEventListener('load',()=>setTimeout(open,300));
})();
</script>
